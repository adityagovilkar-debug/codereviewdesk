<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Review Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%2312141A'/%3E%3Cg fill='%23FFFFFF'%3E%3Ccircle cx='4.5' cy='4.5' r='1.6'/%3E%3Ccircle cx='9' cy='9' r='1.6'/%3E%3Ccircle cx='13.5' cy='13.5' r='1.6'/%3E%3Ccircle cx='13.5' cy='4.5' r='1.6'/%3E%3Ccircle cx='4.5' cy='13.5' r='1.6'/%3E%3C/g%3E%3Cg fill='%235A5E68'%3E%3Ccircle cx='9' cy='4.5' r='1'/%3E%3Ccircle cx='4.5' cy='9' r='1'/%3E%3Ccircle cx='13.5' cy='9' r='1'/%3E%3Ccircle cx='9' cy='13.5' r='1'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ======================================================================
   CODE REVIEW DESK — Instrument White (paper) + Backlit (dark), Bench look.
   Pens: reviews blue · developer burnt · reviewer violet · document viridian · checklist ochre
   ====================================================================== */
:root{
  --paper:#FFFFFF; --paper-2:#FBFAF7; --grid-dot:#DEDDD6; --rule:#E7E6DF; --rule-strong:#D6D5CC;
  --ink:#12141A; --ink-2:#5A5E68; --ink-3:#9A9EA8; --ink-4:#C3C5CB;
  --pen-1:#D93A1E; --pen-2:#1B4FA0; --pen-3:#0E7C63; --pen-4:#B07500; --pen-5:#6B3FA0; --pen-6:#C2410C;
  --good:#0E7C63; --watch:#B07500; --bad:#D93A1E;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","Inter",system-ui,sans-serif;
  --r:3px; --gap:14px; --pen:var(--ink);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:#0E0F12; --paper-2:#15161B; --grid-dot:#24262D; --rule:#1F2127; --rule-strong:#30333B;
  --ink:#E8E9EC; --ink-2:#A6AAB3; --ink-3:#6E727C; --ink-4:#383B43;
  --pen-1:#FF5A3C; --pen-2:#5B8DEF; --pen-3:#2BC29B; --pen-4:#E0A526; --pen-5:#A57BE8; --pen-6:#F07A3A;
  --good:#2BC29B; --watch:#E0A526; --bad:#FF5A3C;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink-2);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dim{color:var(--ink-3)}
.ink2{color:var(--ink-2)}
.small{font-size:11px}
code{font-family:var(--mono);font-size:.92em;background:var(--paper-2);border:1px solid var(--rule);border-radius:2px;padding:0 4px}
kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-2);background:var(--paper)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border:3px solid var(--paper);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:58px 1fr;grid-template-rows:42px 1fr 26px;height:100vh}
.tb{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:5}
.wm{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.34em;font-weight:600;white-space:nowrap}
.wm em{font-style:normal;font-family:var(--sans);letter-spacing:.2em;font-size:8.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.mark{width:18px;height:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.mark i{width:4px;height:4px;border-radius:50%;background:var(--ink-4);transition:background .3s}
.mark i.on{background:var(--ink)}
.mark i.hot{background:var(--pen-1)}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:500}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:10px;height:26px;padding:0 8px 0 10px;border:1px solid var(--rule);border-radius:var(--r);color:var(--ink-3);font-size:11px;min-width:300px;transition:border-color .2s;flex:none}
.cmdk:hover{border-color:var(--rule-strong);color:var(--ink-2)}
.cmdk kbd{margin-left:auto}
.tb-r{display:flex;align-items:center;gap:8px;height:100%}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;transition:border-color .2s;max-width:240px}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill:hover{border-color:var(--rule-strong);color:var(--ink)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
.pill .n{background:var(--ink);color:var(--paper);border-radius:8px;padding:0 5px;font-size:9.5px;line-height:1.5}
.pill.ok i{background:var(--good)} .pill.warn i{background:var(--watch)} .pill.bad i{background:var(--bad)}
.pill.warn{border-color:var(--watch);color:var(--watch)}
.iconbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2)}
.iconbtn:hover{background:var(--rule)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.x{width:22px;height:22px;color:var(--ink-3);font-size:11px}
.iconbtn.x:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

.rail{grid-row:2/3;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;position:relative;background:var(--paper);z-index:4}
.rail .ind{position:absolute;left:0;top:0;width:2px;height:26px;background:var(--ink);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
.rb{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-3);transition:color .2s,background .2s}
.rb:hover:not(:disabled){color:var(--ink);background:var(--paper-2)}
.rb.on{color:var(--ink)}
.rb:disabled{opacity:.3}
.rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.rb .pd{position:absolute;right:6px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--pen);opacity:0;transition:opacity .2s}
.rb.on .pd,.rb:hover:not(:disabled) .pd{opacity:1}
.rb .cnt{position:absolute;right:2px;bottom:3px;font-family:var(--mono);font-size:8.5px;color:var(--pen);font-weight:600}
.rb .tip{position:absolute;left:46px;top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;white-space:nowrap;background:var(--ink);color:var(--paper);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:var(--r);transition:all .18s;z-index:10}
.rb:hover .tip{opacity:1;transform:translate(0,-50%)}
.rail .sep{width:22px;border-top:1px solid var(--rule);margin:6px 0}
.rail .grow{flex:1}

main{grid-row:2/3;position:relative;overflow:auto;background:var(--paper)}
.paper{position:fixed;inset:42px 0 26px 58px;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0);background-size:22px 22px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse 130% 100% at 50% 0%,#000 30%,transparent 92%)}
.sb{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;background:var(--paper);z-index:5}
.sb .led{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--ink-4)}
.sb .led.busy{animation:pulse 1s infinite}
.sb .r{margin-left:auto}
.sb button{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.sb button:hover{color:var(--ink)}
.sb .warn{color:var(--watch)}
@keyframes pulse{50%{opacity:.25}}

#view{position:relative;padding:22px 26px 60px;max-width:1560px;margin:0 auto}
#view.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------------------------------------------------------------- units */
.unit{position:relative;min-width:0;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px 15px}
.unit::before,.unit::after{content:"";position:absolute;width:7px;height:7px;border:solid var(--rule-strong);pointer-events:none;transition:width .3s,height .3s,border-color .3s}
.unit::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.unit::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.unit.hv{transition:border-color .25s,transform .25s}
.unit.hv:hover{border-color:var(--rule-strong)}
.unit.hv:hover::before,.unit.hv:hover::after{width:16px;height:16px;border-color:var(--pen,var(--ink-2))}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule)}
.head h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:8px}
.head h2 i{width:6px;height:6px;border-radius:50%;background:var(--pen)}
.head h2 .no{font-family:var(--mono);color:var(--pen);letter-spacing:.1em;font-weight:500}
.meta{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.sech{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sech .lbl{white-space:nowrap}
.sech::after{content:"";flex:1;border-top:1px dotted var(--rule-strong)}
.readouts{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.ro{background:var(--paper);padding:8px 9px 9px;min-width:0;flex:1 1 150px}
.ro .k{display:block;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .v{display:block;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.ro .v.sans{font-family:var(--sans)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:30px;padding:0 13px;border:1px solid var(--rule-strong);border-radius:var(--r);font-size:11px;letter-spacing:.04em;color:var(--ink);transition:all .18s,transform .12s;white-space:nowrap;background:var(--paper)}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri,.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover:not(:disabled),.btn.primary:hover:not(:disabled){opacity:.88}
.btn.danger{color:var(--bad)}
.btn.sm{height:24px;padding:0 9px;font-size:10.5px}
.btn.ghost{border-color:transparent}
.btn.ghost:hover:not(:disabled){border-color:var(--rule-strong)}
.btn.block{width:100%}
.btn kbd{font-size:9px;padding:0 4px;opacity:.75}
.btn.pri kbd{background:transparent;color:inherit;border-color:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:22px;padding:0 9px;border:1px solid var(--rule);border-radius:var(--r);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);transition:all .15s;display:inline-flex;align-items:center;gap:6px;background:var(--paper);white-space:nowrap}
button.chip:hover{border-color:var(--rule-strong);color:var(--ink)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--pen,var(--ink-3));flex:none}
.chip.st{color:var(--ink)}
.chip.none{color:var(--ink-3);border-style:dashed}
.chip.none i{background:none;border:1px dashed var(--ink-3)}
.kb{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border:1px solid var(--rule-strong);border-radius:var(--r);font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--paper)}
.kb i{width:6px;height:6px;border-radius:50%;background:var(--pen)}
.kb.solid{border-color:var(--pen);color:var(--pen)}
.kb.hollow i{background:none;border:1px solid var(--pen)}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field>.k{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.field>.k b{color:var(--bad);font-weight:600}
.field .hint{font-size:10.5px;color:var(--ink-3);line-height:1.45}
.inp{height:30px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);padding:0 10px;font-family:var(--mono);font-size:12px;outline:0;transition:border-color .2s;width:100%;min-width:0}
.inp:focus{border-color:var(--ink-2)}
.inp.sans{font-family:var(--sans);font-size:12.5px}
.inp:disabled{background:var(--paper-2);color:var(--ink-2)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5;font-family:var(--sans);font-size:12.5px}
select.inp{padding:0 6px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:11.5px;color:var(--ink-2);cursor:pointer;text-align:left;width:100%}
.tog .sw{width:26px;height:14px;border:1px solid var(--rule-strong);border-radius:8px;position:relative;transition:all .2s;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--ink-4);transition:all .2s}
.tog.on .sw{border-color:var(--ink)}
.tog.on .sw::after{left:14px;background:var(--ink)}
.tog.inline{width:auto;padding:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink-3);font-size:11.5px;line-height:1.6;padding:22px 20px}
.empty b{color:var(--ink);font-size:13px;font-weight:600}
.note{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 0 2px;font-size:11.5px;line-height:1.55;color:var(--ink-3)}
.note .ring{width:11px;height:11px;border:1px solid var(--ink-3);border-radius:50%;margin-top:2px}
.note b{color:var(--ink-2);font-weight:600}
input.ck{-webkit-appearance:none;appearance:none;width:14px;height:14px;border:1px solid var(--ink-3);border-radius:2px;margin:2px 0 0;display:inline-grid;place-items:center;cursor:pointer;background:var(--paper);flex:none;transition:background .15s,border-color .15s}
input.ck:hover:not(:disabled){border-color:var(--ink)}
input.ck:checked{background:var(--pen,var(--ink));border-color:var(--pen,var(--ink))}
input.ck:checked::after{content:"";width:7px;height:4px;border:solid var(--paper);border-width:0 0 1.5px 1.5px;transform:translateY(-1px) rotate(-45deg)}
input.ck:indeterminate{border-color:var(--pen,var(--ink))}
input.ck:indeterminate::after{content:"";width:6px;height:1.5px;background:var(--pen,var(--ink))}
input.ck.big{width:18px;height:18px}
input.ck.big:checked::after{width:9px;height:5px}
input.ck:disabled{opacity:.55;cursor:default}
fieldset.fs{border:0;margin:0;padding:0;min-width:0;display:grid;gap:var(--gap)}

/* tool header */
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.th .no{font-family:var(--mono);font-size:11px;color:var(--pen);letter-spacing:.14em}
.th h1{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.th h1 .tk{font-family:var(--mono);letter-spacing:-.01em}
.th h1 span.t{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.th .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ------------------------------------------------------------- layouts */
.g{display:grid;gap:var(--gap)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.mt{margin-top:var(--gap)}
.stack{display:grid;gap:var(--gap);align-content:start}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--gap);align-items:start}
.side{position:sticky;top:0;display:grid;gap:var(--gap)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.frm .full{grid-column:1/-1}
.tbl-wrap{overflow-x:auto}

/* banners */
.banner{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--rule);border-left:2px solid var(--pen);border-radius:var(--r);font-size:12px;line-height:1.55;background:var(--paper)}
.banner .ic{width:8px;height:8px;border-radius:50%;background:var(--pen)}
.banner.pulse .ic{animation:pulse 1.6s infinite}
.banner b{font-weight:600}
.banner .q{white-space:pre-wrap;color:var(--ink-2);margin-top:3px;font-style:italic}
.banners{display:grid;gap:8px;margin-bottom:var(--gap)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 8px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px dotted var(--rule-strong);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.link{cursor:pointer;transition:background .15s}
.tbl tr.link:hover td{background:var(--paper-2)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .nm{font-family:var(--mono);font-weight:600;font-size:12px}
.tbl .sub{color:var(--ink-3);font-size:11px;margin-top:2px;max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.ed td{padding:4px 6px;border-bottom:0}
.tbl.ed th{padding:0 6px 6px}
.tbl.ed td:last-child{width:30px;text-align:center}
.tbl.ro td{vertical-align:top}
.addrow{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* home */
.hero{min-height:220px;padding:0;overflow:hidden;display:flex}
.hero canvas.bg{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding:24px 28px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.hero h1{margin:2px 0 0;font-weight:500;font-size:30px;letter-spacing:-.015em}
.hero h1 b{font-family:var(--mono);font-weight:600}
.hero .sub{font-size:12px;color:var(--ink-2);line-height:1.6}
.hero .sub b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.pipe{position:relative;width:380px;flex:none}
.pipe canvas{position:absolute;inset:0;width:100%;height:100%}
.bigsearch{display:flex;align-items:center;gap:12px;width:min(560px,100%);height:40px;padding:0 12px 0 14px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper);color:var(--ink-3);font-size:12.5px;transition:border-color .2s;margin-top:auto}
.bigsearch:hover{border-color:var(--ink-2)}
.bigsearch kbd{margin-left:auto}
.bigsearch .caret{width:1px;height:16px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.q-list{display:grid}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 6px;border-top:1px dotted var(--rule-strong);cursor:pointer;border-radius:var(--r);transition:background .15s;align-items:center}
.qrow:first-child{border-top:0}
.qrow:hover{background:var(--paper-2)}
.qrow .t1{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* readiness + side */
.ready{display:grid}

/* checklist sections */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.secs{display:grid;gap:8px}
.sec{border:1px solid var(--rule);border-radius:var(--r);background:var(--paper)}

.rv .item-top{grid-template-columns:24px minmax(0,1fr) auto;cursor:default}

.seg button{height:22px;padding:0 10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border-radius:2px;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.summary{white-space:pre-wrap;margin:12px 0 0;padding:10px 12px;border-left:2px solid var(--pen);background:var(--paper-2);font-size:12.5px;line-height:1.6}
.summary b{display:block;margin-bottom:2px}

/* transports (reviewer) */
.trlist{display:grid}
.tri{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dotted var(--rule-strong)}

.was{font-family:var(--mono);font-size:10px;color:var(--ink-3)}

.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:3px 5px;min-height:30px;cursor:text;transition:border-color .2s}

.tag{display:inline-flex;align-items:center;height:20px;border:1px solid var(--rule-strong);border-radius:2px;padding:0 0 0 7px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--paper-2);white-space:nowrap}

/* document */
.sheetwrap{display:flex;justify-content:center;padding:6px 0 0}
.sheet{background:#fff;color:#1d2330;border:1px solid var(--rule-strong);padding:30px 34px;overflow-x:auto;width:100%;max-width:1180px;box-shadow:0 1px 0 var(--rule),0 18px 40px -24px rgba(0,0,0,.35)}

.archive ol{margin:6px 0 0;padding-left:18px}
.stamp{display:inline-block;transform:rotate(-6deg);border:1.5px solid var(--pen,var(--good));color:var(--pen,var(--good));padding:3px 7px 2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;border-radius:2px;outline:1px solid var(--pen,var(--good));outline-offset:2px;background:var(--paper);white-space:nowrap}

/* checklist setup */
.trow{display:grid;grid-template-columns:minmax(170px,240px) minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px dotted var(--rule-strong)}
.trow:first-child{border-top:0}
.tchip{height:22px;padding:0 9px;border:1px solid var(--rule);border-radius:var(--r);font-size:11px;color:var(--ink-3);background:var(--paper);transition:all .15s;display:inline-flex;align-items:center;gap:6px}

.sec-h .sec-title:hover{border-color:var(--rule)}
.titem{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 12px;border-top:1px dotted var(--rule-strong)}
.titem:first-child{border-top:0}
.titem .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:right;padding-top:8px}

.titem.add{display:block;padding:9px 12px 9px 46px}
.tplstate{display:grid;gap:8px}

.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(3px);display:none}

    {
     "id": "GEN-06",
     "text": "Naming standards, appropriate message class / development class / transport naming convention / program header / modification history have been checked."

    {
     "id": "GEN-07",
     "text": "Program documentation is maintained for any object modification. All changes are maintained with a search term so that the change can be tracked with the ticket no."

    {
     "id": "GEN-08",

     "text": "Global variables are minimized by declaring local variables or by passing variables through parameters and arguments while creating internal subroutines."

     "id": "GEN-11",
     "text": "Remove dead code, perform Extended Checks / Code Inspector and do Pretty Print."

    {
     "id": "GEN-12",
     "text": "Runtime analysis (SE30) and SQL Trace (ST05) have been done for complex reports to check the performance of the program and database time taken."

    {
     "id": "GEN-13",
     "text": "Do not use nested IF..ELSEIF… instead use CASE..ENDCASE wherever applicable. When coding IF or CASE, testing conditions are nested so that the most frequently true conditions are processed first."
    },
    {
     "id": "GEN-14",
     "text": "Sort fields on the SORT statement are not left as default (i.e. SORT ITAB BY FLD1 instead of SORT ITAB). Sort the internal table before using the “BINARY SEARCH” feature."

    {
     "id": "GEN-15",
     "text": "Use a field symbol when modifying data in an internal table instead of a work area. Do not declare field symbols with type ANY."

     "id": "GEN-16",
     "text": "Has the internal table used in “FOR ALL ENTRIES IN” been checked for emptiness?"

    },
    {
     "id": "GEN-18",

    },
    {
     "id": "DAT-09",
     "text": "Use a field symbol when modifying data in an internal table instead of a work area."
    },
    {
     "id": "DAT-10",
     "text": "Language key is passed when reading text descriptions. When displaying amount fields, the currency field is aligned."

     "text": "Data is not retrieved using non-primary-key fields — use the primary key or a secondary index, following the order of the key/index fields in the WHERE clause."

  {
   "id": "REP",
   "title": "Report Standard",
   "next": 5,
   "items": [

     "id": "REP-01",
     "text": "Error handling is done properly — instead of an error message, an information message and “LEAVE LIST-PROCESSING” can be used to return to the selection screen."

    {

  {
   "id": "BAT",
   "title": "Batch Program / Interface Standard",
   "next": 11,
   "items": [
    {
     "id": "BAT-01",
     "text": "Function module AUTHORITY_CHECK_DATASET is called before opening a file to check the user's authorization for OPEN / READ / TRANSFER / DELETE DATASET."

     "text": "The dataset is OPENed before read/write operations and always explicitly CLOSEd when file processing is finished."

    {

<script>
'use strict';
/* ======================================================================
   CODE REVIEW DESK — checklist handoff between an ABAP developer and a reviewer.
   One HTML file, no server. Reviews live in a OneDrive-synced Teams folder
   (reviews/*.json, one file per review, updated in place with a clash check),
   or travel as .json files. The team checklist is checklist.json in that folder,
   or the JSON block <script id="crd-template"> above.
   ====================================================================== */
/* Checklist template: read from the JSON block above. Edit it in the app via "Checklist setup". */
const BUILTIN_TPL = JSON.parse(document.getElementById('crd-template').textContent);
/* Pristine copy of this page, captured before anything renders, for "Download tool with this checklist". */
const BASE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML.replace(/^<html([^>]*?) data-theme="[^"]*"/, '<html$1');
const VER = '2.0.0';
const STATUS = {
  F:  { label: 'Followed',       short: 'Followed',     code: '1-Followed',       pen: 'good', mark: '✔', wiki: '(/)' },
  N:  { label: 'Not followed',   short: 'Not followed', code: '0-Not followed',   pen: 'bad', mark: '✖', wiki: '(x)' },
  NA: { label: 'Not applicable', short: 'N/A',          code: '2-Not applicable', pen: 'ink-3', mark: '–', wiki: '(i)' },
};
const MODULES = ['PA', 'OM', 'PY', 'PT', 'PD', 'PB', 'TM', 'ESS/MSS', 'CATS', 'ECP', 'FI', 'CO', 'MM', 'SD', 'Cross-module'];
const STAGES = {
  draft:     { label: 'Draft',             stamp: 'DRAFT',             pen: 'ink-3' },
  submitted: { label: 'In review',         stamp: 'IN REVIEW',         pen: 'watch' },
  changes:   { label: 'Changes requested', stamp: 'CHANGES REQUESTED', pen: 'bad' },
  approved:  { label: 'Approved',          stamp: 'APPROVED',          pen: 'good' },
};
const VIEW_PEN = { home: 'pen-2', dev: 'pen-6', rev: 'pen-5', report: 'pen-3', checklist: 'pen-4' };
const VIEW_TITLE = { home: 'Reviews', dev: 'Developer', rev: 'Reviewer', report: 'Document', checklist: 'Checklist setup' };
const DOC_VIEWS = ['dev', 'rev', 'report'];

/* ============================================================ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pen = k => `var(--${k})`;
const nowIso = () => new Date().toISOString();
const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = iso => iso ? iso.slice(0, 10).split('-').reverse().join('.') : '';
const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const daysSince = iso => iso ? (Date.now() - Date.parse(iso)) / 864e5 : Infinity;
function ageText(iso) {
  const d = daysSince(iso);
  if (!isFinite(d)) return '';
  if (d < 1 / 24) return 'just now';
  if (d < 1) return Math.round(d * 24) + ' h';
  return Math.floor(d) + ' d';
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const splitList = s => String(s || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pl = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

const store = {
  warned: false,
  get(k, d) { try { const v = localStorage.getItem('crd.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem('crd.' + k, JSON.stringify(v)); return true; }
    catch {
      if (!store.warned) { store.warned = true; setTimeout(() => toast('This browser’s storage is full, so the automatic local copy has stopped. Save to the shared folder or to a file now.', true), 0); }
      return false;
    }
  },
  del(k) { try { localStorage.removeItem('crd.' + k); } catch { /* ignore */ } },
  keys(prefix) { try { return Object.keys(localStorage).filter(k => k.startsWith('crd.' + prefix)).map(k => k.slice(4)); } catch { return []; } },
};

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks.at(-1)] = v;
}

/* Tamper-evidence fingerprint (not a cryptographic signature). */
function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const isThisRoundRevAdd = (d, it) => it && it.by === 'rev' && it.addedRound === d.round;
function devSealOf(d) {
  const items = {};
  for (const [id, it] of Object.entries(d.items)) if (it.sel && !isThisRoundRevAdd(d, it)) items[id] = { dev: it.dev, reply: it.reply || '' };
  return hash(stable({
    h: d.header, o: d.objects, b: d.backupOn ? d.backup : [], r: d.round, p: d.pastRounds,
    c: d.checklist.filter(x => !isThisRoundRevAdd(d, d.items[x.id])).map(x => [x.id, x.text]), i: items,
    ...(d.schema >= 2 ? { t: trsOf(d).map(t => [t.tr, t.system, t.note]) } : {}),
  }));
}
function revSealOf(d) {
  const items = {};
  for (const [id, it] of Object.entries(d.items)) if (it.sel) items[id] = it.rev;
  return hash(stable({ dev: d.seals.dev, rv: d.review, i: items, r: d.round, ...(d.schema >= 2 ? { tc: trsOf(d).map(t => [!!t.checked, t.revNote]) } : {}) }));
}

/* ============================================================ checklist template */
const tplHash = t => hash(stable({ n: t.name, v: t.version, sy: t.systems, s: t.sections, o: t.objectTypes }));
const BUILTIN_HASH = tplHash(BUILTIN_TPL);
function normalizeTpl(t) {
  const out = {
    name: String(t?.name || 'Code Review Checklist'), version: String(t?.version || '1'),
    systems: Array.isArray(t?.systems) ? t.systems.map(String) : [],
    sections: (t?.sections || []).map(s => ({
      id: String(s.id), title: String(s.title ?? ''),
      next: +s.next || (s.items?.length || 0) + 1,
      items: (s.items || []).map(i => ({ id: String(i.id), text: String(i.text ?? '') })),
    })),
    objectTypes: (t?.objectTypes || []).map(o => ({ id: String(o.id), label: String(o.label ?? ''), secs: (o.secs || []).map(String) })),
  };
  for (const s of out.sections) {
    const maxN = Math.max(0, ...s.items.map(i => +String(i.id).split('-').pop() || 0));
    s.next = Math.max(s.next, maxN + 1);
  }

/* ======================================================================

   ====================================================================== */
const TAU = Math.PI * 2;
const C = {};
const CKEYS = ['paper', 'paper-2', 'ink', 'ink-2', 'ink-3', 'ink-4', 'rule', 'rule-strong', 'pen-1', 'pen-2', 'pen-3', 'pen-4', 'pen-5', 'pen-6', 'good', 'watch', 'bad'];

/* Proportion: dots round a circle, filled clockwise from 12 o'clock. Unlit dots are always drawn. */

    const t = i / n, a = -Math.PI / 2 + t * TAU, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;

function dotBar(frac, n = 14, p = 'var(--ink)') {

/* scheduler: animated scopes draw every frame; static ones draw once (plus a short intro, and on hover). */
const scopes = [];
function scope(cv, draw, opts = {}) {

    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;

    if (k !== s.hi) { s.hi = k; s.dirty = true; }

}
let lastT = performance.now();
function frame(t) {

    if (s.cv.offsetParent === null) continue;
    const w = s.cv.clientWidth, h = s.cv.clientHeight;
    if (!w || !h) continue;
    if (w !== s.w || h !== s.h) { s.w = w; s.h = h; s.cv.width = Math.round(w * dpr); s.cv.height = Math.round(h * dpr); s.dirty = true; }

function showTip(html, x, y) { const el = $('#ctip'); el.innerHTML = html; el.style.display = 'block'; const r = el.getBoundingClientRect(); el.style.left = Math.min(innerWidth - r.width - 8, x + 14) + 'px'; el.style.top = Math.max(8, y - r.height - 10) + 'px'; }

/* Home hero: an ambient flow field. Its energy is real — the number of reviews waiting on you. */
function drawFlow(ctx, w, h, t, dt, s) {
  const wait = waitingCount();
  const want = 70 + Math.min(6, wait) * 22, hot = Math.min(want, wait * 9);
  s.ps ||= [];
  while (s.ps.length < want) s.ps.push({ x: Math.random() * w, y: Math.random() * h });
  if (s.ps.length > want) s.ps.length = want;
  const k = reduced ? 0 : dt / 1000, tt = reduced ? 0 : t;
  for (let i = 0; i < s.ps.length; i++) {
    const p = s.ps[i];
    const ang = Math.sin(p.x * .007 + tt * .00011) * 1.5 + Math.cos(p.y * .012 - tt * .00009) * 1.3;
    const sp = i < hot ? 30 : 16;
    p.x += Math.cos(ang) * sp * k; p.y += Math.sin(ang) * sp * k;
    if (p.x < -4 || p.x > w + 4 || p.y < -4 || p.y > h + 4) { p.x = Math.random() * w; p.y = Math.random() * h; }
    const edge = clamp(Math.min(p.x, w - p.x) / 70, 0, 1) * clamp(Math.min(p.y, h - p.y) / 30, 0, 1);
    const side = .25 + .75 * clamp((p.x / w - .25) / .5, 0, 1);
    dot(ctx, p.x, p.y, i < hot ? 1.35 : 1, i < hot ? C['pen-2'] : C['ink-3'], (i < hot ? .75 : .3) * edge * side);
  }
}
/* Home hero, right: the team's pipeline. One dot per review, unlit slots always drawn. */
function drawPipe(ctx, w, h, t, dt, s, p) {
  const R = shared.reviews;
  const cols = [
    { k: 'draft', label: 'DRAFTS', n: R.filter(x => x.stage === 'draft').length, col: C['ink-2'] },
    { k: 'submitted', label: 'IN REVIEW', n: R.filter(x => x.stage === 'submitted').length, col: C.watch },
    { k: 'changes', label: 'BEING FIXED', n: R.filter(x => x.stage === 'changes').length, col: C.bad },
    { k: 'approved', label: 'APPROVED 30 D', n: R.filter(x => x.stage === 'approved' && daysSince(x.updatedAt) <= 30).length, col: C.good },
  ];
  const pad = 22, cw = (w - pad * 2) / cols.length, gx = 9, rows = 6, per = 4, top = 38;
  cols.forEach((c, ci) => {
    const x0 = pad + ci * cw + (cw - (per - 1) * gx) / 2, cap = rows * per, lit = Math.min(c.n, cap) * p;
    for (let j = 0; j < cap; j++) {

      if (j < lit - 1e-6) dot(ctx, x, y, 2.4, c.col, .9); else dot(ctx, x, y, 1.05, C['ink-4']);

    label(ctx, c.label, cx, top + rows * gx + 44, { size: 7.5, spacing: 1.4 });
    s.hits.push({ x: pad + ci * cw, y: 0, w: cw, h, tip: `<b>${c.n}</b> ${c.label.toLowerCase()}${c.n > cap ? ` (first ${cap} shown as dots)` : ''}`, go: () => { ui.sharedStage = c.k; paintShared(); $('#sharedAll')?.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); } });
    if (s.hi === ci) ring(ctx, cx, top + rows * gx / 2 + 4, Math.max(cw / 2 - 8, 20), c.col, .25);
  });
  label(ctx, 'TEAM PIPELINE', w - pad, 16, { size: 7.5, spacing: 1.6, align: 'right' });
}
/* Progress ring for the side panels: outer = checks, inner = transports (reviewer only). */
function drawProg(ctx, w, h, t, dt, s, p, o) {

  if (o.inner) dotRing(ctx, cx, cy, R - 9, o.inner.total ? (o.inner.done / o.inner.total) * p : 0, 34, o.inner.col);
  label(ctx, `${Math.round(o.done * p)}/${o.total}`, cx, cy - 2, { font: MONO, size: 14, weight: 500, color: C.ink });

}

/* ============================================================ home */
function qrowHtml(x) {
  const rev = x.revName || x.revId || x.asgName || x.asgId;

function devChecks(d) {
  const sel = selItems(d);
  const noS = sel.filter(([, i]) => !i.dev.s).length;
  const noC = sel.filter(([, i]) => i.dev.s === 'N' && !i.dev.c.trim()).length;
  const list = [
    { ok: !!d.header.ticket.trim(), t: 'Ticket number' },
    { ok: !!d.header.devId.trim(), t: 'Developer SAP ID' },
    { ok: d.objects.some(o => o.name.trim()), t: 'At least one object' },
    { ok: trsOf(d).length > 0, t: 'At least one transport request' },
    { ok: sel.length > 0, t: sel.length ? `${pl(sel.length, 'check')} ticked` : 'Tick the checks that apply' },
    { ok: sel.length > 0 && noS === 0, t: noS ? `${pl(noS, 'ticked check')} still need${noS === 1 ? 's' : ''} your self-review` : 'Self-review done' },
    { ok: noC === 0, t: noC ? `${noC} “Not followed” need${noC === 1 ? 's' : ''} a reason` : 'Exceptions explained' },
  ];
  if (d.stage === 'changes') {
    const open = sel.filter(([, i]) => i.rev.s === 'N' && !i.reply.trim()).length;
    list.push({ ok: open === 0, t: open ? `${pl(open, 'flagged check')} need${open === 1 ? 's' : ''} your answer` : 'Reviewer findings answered' });
  }
  if (d.assignee.id && sameId(d.assignee.id, d.header.devId)) list.push({ ok: false, soft: true, t: 'The reviewer is the same person as the developer' });
  return list;
}

}
function devItem(i) {

    ? `<div class="revnote"><span class="lbl">Reviewer</span>${chip(it.rev.s)}<span>${esc(it.rev.c)}</span></div>
       ${it.rev.s === 'N' || it.rev.c ? `<input class="inp sans cmt" data-b="items.${i.id}.reply" value="${esc(it.reply)}" placeholder="Your response to the reviewer${it.rev.s === 'N' ? ' (required)' : ''}">` : ''}`
    : '';
  return `<div class="item${on ? ' on' : ''}" data-q="${esc((i.id + ' ' + i.text).toLowerCase())}">
    <label class="item-top"><input type="checkbox" class="ck" style="--pen:var(--pen-6)" data-a="selItem" data-id="${esc(i.id)}" ${on ? 'checked' : ''}><span class="num">${i.n}</span><span>${esc(i.text)}${it?.by === 'rev' ? ' <span class="kb" style="--pen:var(--pen-5)"><i></i>Added by reviewer</span>' : ''}</span><span></span></label>
    ${on ? `<div class="item-x">${seg('devS', i.id, it.dev.s)}

}
function devSide() {

    ${unit('Checklist', `<div class="ringbox"><canvas data-ch="prog" data-o='${esc(JSON.stringify(o))}'></canvas>
      <div class="legend"><span style="--pen:var(--good)"><i></i>Followed<b>${n('F')}</b></span><span style="--pen:var(--bad)"><i></i>Not followed<b>${n('N')}</b></span><span style="--pen:var(--ink-3)"><i></i>N/A<b>${n('NA')}</b></span><span style="--pen:var(--ink-4)"><i></i>To assess<b>${sel.length - done}</b></span></div></div>

/* ============================================================ reviewer view */
function revChecks(d) {
  const sel = selItems(d);
  const pending = sel.filter(([, i]) => !i.rev.s).length;
  const noC = sel.filter(([, i]) => i.rev.s === 'N' && !i.rev.c.trim()).length;
  const trs = trsOf(d), trOpen = trs.filter(t => !t.checked).length;
  const list = [
    { ok: !!d.review.revId.trim(), t: 'Reviewer SAP ID' },
    { ok: !!d.review.date, t: 'Review date' },
    { ok: String(d.review.effort).trim() !== '', t: 'Review effort (person hours)' },
    ...(trs.length ? [{ ok: trOpen === 0, t: trOpen ? `${pl(trOpen, 'transport')} not checked yet` : 'Every transport checked' }] : []),
    { ok: sel.length > 0 && pending === 0, t: pending ? `${pl(pending, 'check')} still to review` : 'Every check reviewed' },
    { ok: noC === 0, t: noC ? `${noC} “Not followed” need${noC === 1 ? 's' : ''} a comment` : 'Findings explained' },
    { ok: !!d.review.verdict, t: 'Verdict' },
  ];
  if (sameId(d.review.revId, d.header.devId)) list.push({ ok: false, soft: true, t: 'Reviewer ID is the same as the developer’s' });
  if (d.assignee.id && d.review.revId && !sameId(d.assignee.id, d.review.revId)) list.push({ ok: false, soft: true, t: `Assigned to ${who(d.assignee.id, d.assignee.name)}, not you` });
  return list;
}
function vRev() {
  const d = doc, h = d.header;
  const tampered = d.seals.dev && devSealOf(d) !== d.seals.dev;
  const lastRound = d.pastRounds.at(-1);
  const secs = selectedSections(d);
  const show = it => ui.revFilter === 'all' || (ui.revFilter === 'pending' && !it.rev.s) || (ui.revFilter === 'issues' && (it.rev.s === 'N' || it.dev.s === 'N'));
  const trs = trsOf(d), nChecked = trs.filter(t => t.checked).length;
  const banners = [];
  if (tampered) banners.push(`<div class="banner" style="--pen:var(--bad)"><span class="ic"></span><span><b>This file was changed after the developer sent it.</b> The developer’s section no longer matches the fingerprint taken when it was submitted. Check with ${esc(devWho(d))} that you have the right file.</span><span></span></div>`);
  if (d.round > 1) banners.push(`<div class="banner" style="--pen:var(--pen-5)"><span class="ic"></span><span><b>Round ${d.round}.</b> Changes were requested in round ${lastRound?.round}. Checks flagged then are reset for you to check again, with the developer’s answers under each one. Transports need ticking again too.</span><span></span></div>`);
  const ro = (k, v, sans) => `<div class="ro"><span class="k">${k}</span><span class="v${sans ? ' sans' : ''}">${v || '<span class="dim">—</span>'}</span></div>`;

  return `<div class="th rise" style="--pen:var(--pen-5)"><div><div class="no">03 · REVIEWER</div><h1><span class="tk">${esc(h.ticket)}</span>${h.title ? `<span class="t">${esc(h.title)}</span>` : ''}</h1></div>
      <div class="acts">${stageKb(d.stage, d.round)}</div></div>
    ${banners.length ? `<div class="banners rise">${banners.join('')}</div>` : ''}
    <div class="lay"><div class="stack">
    ${unit('<span class="no">01</span> Change under review', `<div class="readouts">
        ${ro('Ticket', esc(h.ticket))}${ro('Module', esc(h.module))}${ro('Developer', esc(devWho(d)), true)}${ro('Created', fmtDate(h.created))}
        ${d.assignee.id || d.assignee.name ? ro('Assigned reviewer', esc(who(d.assignee.id, d.assignee.name)), true) : ''}
        ${ro('Development system', splitList(h.devSystem).map(esc).join(', '))}${ro('Import into', splitList(h.importSystem).map(esc).join(', '))}
      </div>
      ${h.title || h.summary ? `<div class="summary">${h.title ? `<b>${esc(h.title)}</b>` : ''}${esc(h.summary)}</div>` : ''}
      <div class="tbl-wrap" style="margin-top:12px"><table class="tbl ro"><thead><tr><th>Object</th><th>Type</th><th>Note</th></tr></thead><tbody>
        ${d.objects.filter(o => o.name).map(o => `<tr><td class="nm">${esc(o.name)}</td><td>${esc(typeLabelOf(o))}</td><td>${esc(o.note)}</td></tr>`).join('')}
      </tbody></table></div>
      ${d.backupOn && d.backup.length ? `<details class="more"><summary>Version backup (${d.backup.length})</summary>
        <div class="tbl-wrap"><table class="tbl ro"><thead><tr><th>Object</th><th>System</th><th>Dev</th><th>PreProd</th><th>Prod</th></tr></thead><tbody>
        ${d.backup.map(b => `<tr><td class="nm">${esc(b.object)}</td><td>${esc(b.system)}</td><td class="mono">${esc(b.dev)}</td><td class="mono">${esc(b.preprod)}</td><td class="mono">${esc(b.prod)}</td></tr>`).join('')}
        </tbody></table></div></details>` : ''}`, { p: 'pen-5' })}

    ${unit('<span class="no">02</span> Transport requests', trs.length ? `<div class="tools"><button class="btn sm" data-a="copyTrs">Copy all TR numbers</button><span class="dim small">Tick each transport once you have opened and checked it.</span></div>
      <div class="trlist">${trs.map(t => { const i = d.transports.indexOf(t); return `<div class="tri${t.checked ? ' done' : ''}">
        <input type="checkbox" class="ck big" style="--pen:var(--good)" data-a="trCheck" data-i="${i}" ${t.checked ? 'checked' : ''} title="Mark as checked">
        <div class="trmain">
          <div class="trhead"><span class="trno">${esc(t.tr)}</span><button class="btn sm ghost" data-a="copyTr" data-i="${i}" title="Copy ${esc(t.tr)}">Copy</button><span class="dim mono small">${esc(t.system) || '—'}</span>${!t.checked && t.checkedRound ? `<span class="was">checked in round ${t.checkedRound}</span>` : ''}</div>
          ${t.note ? `<p class="cm">${esc(t.note)}</p>` : ''}
          <input class="inp sans cmt" data-b="transports.${i}.revNote" value="${esc(t.revNote)}" placeholder="Reviewer note (optional)">
        </div>
      </div>`; }).join('')}</div>` : '<div class="empty"><span>The developer listed no transport requests.</span></div>', { p: 'pen-5', meta: `<span id="trCount">${nChecked} / ${trs.length} checked</span>` })}

    ${unit('<span class="no">03</span> Reviewer details', `<div class="frm">
        ${fld('Check performed by (SAP ID)', 'review.revId', { req: true, mono: true })}
        ${fld('Reviewer name', 'review.revName')}
        ${fld('Review date', 'review.date', { type: 'date', req: true, mono: true })}
        ${fld('Review effort (person hours)', 'review.effort', { type: 'number', req: true, ph: 'e.g. 1.5', mono: true })}
      </div>`, { p: 'pen-5' })}

    ${unit('<span class="no">04</span> Checks', `<div class="tools">
        <div class="chips">${[['all', 'All'], ['pending', 'To review'], ['issues', 'Not followed']].map(([k, l]) => `<button class="chip${ui.revFilter === k ? ' on' : ''}" data-a="revFilter" data-v="${k}">${l}</button>`).join('')}</div>

        <button class="btn sm" data-a="addMissed">＋ Add a check the developer missed</button>
      </div>
      <div class="secs">${secs.map(s => {
        const items = s.items.filter(i => show(d.items[i.id]));
        if (!items.length) return '';
        const rv = s.items.filter(i => d.items[i.id].rev.s).length;
        return `<div class="sec"><div class="sec-h" style="cursor:default"><h3>${esc(s.title)}</h3><span class="cnt">${dotBar(rv / s.items.length, 12, 'var(--pen-5)')}${rv}/${s.items.length}</span></div>
          <div class="sec-b">${items.map(i => revItem(i)).join('')}</div></div>`;
      }).join('') || '<div class="empty"><span>Nothing matches this filter.</span></div>'}</div>`, { p: 'pen-5' })}

    ${unit('<span class="no">05</span> Verdict', `<div class="pick">
        <button class="opt${d.review.verdict === 'approve' ? ' on' : ''}" style="--pen:var(--good)" data-a="verdict" data-v="approve"><span class="rd2"></span><span><span class="ot">Approve</span><span class="os">Meets the checklist. Ready to archive.</span></span></button>
        <button class="opt${d.review.verdict === 'changes' ? ' on' : ''}" style="--pen:var(--bad)" data-a="verdict" data-v="changes"><span class="rd2"></span><span><span class="ot">Request changes</span><span class="os">It goes back to the developer for another round.</span></span></button>
      </div>
      ${fld('Overall comment', 'review.comment', { area: true, wide: true, rows: 3, ph: 'Summary for the developer and the archive.' })}`, { p: 'pen-5' })}
    </div>
    <aside class="side" id="side">${revSide()}</aside></div>`;
}
function revItem(i) {
  const d = doc, it = d.items[i.id];
  const lr = d.pastRounds.at(-1);
  const prev = lr?.items?.[i.id];
  return `<div class="item rv st-${it.rev.s || 'none'}">
    <div class="item-top"><span class="num">${i.n}</span><span>${esc(i.text)}</span>
      <span>${it.by === 'rev' ? `<span class="kb" style="--pen:var(--pen-5)"><i></i>Added by reviewer</span>${isThisRoundRevAdd(d, it) ? ` <button class="iconbtn x" data-a="unMissed" data-id="${esc(i.id)}" title="Remove this added check">✕</button>` : ''}` : ''}</span></div>
    <div class="rv-grid">

        ${prev && (prev.s === 'N' || prev.c || prev.reply) ? `<div class="prev">Round ${lr.round} review: ${STATUS[prev.s]?.label || '—'}${prev.c ? ` — ${esc(prev.c)}` : ''}${prev.reply ? `<br>Developer’s answer: ${esc(prev.reply)}` : ''}</div>` : ''}
      </div>
      <div class="rv-col"><span class="lbl">Reviewer</span>${seg('revS', i.id, it.rev.s)}
        <input class="inp sans cmt" data-b="items.${i.id}.rev.c" value="${esc(it.rev.c)}" placeholder="${it.rev.s === 'N' ? 'What needs fixing? (required)' : 'Reviewer comment (optional)'}">
      </div>

function revSide() {
  const d = doc, sel = selItems(d).map(([, i]) => i);
  const done = sel.filter(i => i.rev.s).length;
  const n = k => sel.filter(i => i.rev.s === k).length;
  const trs = trsOf(d), trDone = trs.filter(t => t.checked).length;
  const checks = revChecks(d), ready = checks.filter(c => !c.soft).every(c => c.ok);
  const o = { total: sel.length, done, pen: 'pen-5', sub: 'REVIEWED', ...(trs.length ? { inner: { total: trs.length, done: trDone, pen: 'good' } } : {}) };
  return `${unit('Progress', `<div class="ringbox"><canvas data-ch="prog" data-o='${esc(JSON.stringify(o))}'></canvas>
      <div class="legend"><span style="--pen:var(--good)"><i></i>Followed<b>${n('F')}</b></span><span style="--pen:var(--bad)"><i></i>Not followed<b>${n('N')}</b></span><span style="--pen:var(--ink-3)"><i></i>N/A<b>${n('NA')}</b></span>${trs.length ? `<span style="--pen:var(--good)"><i style="background:none;border:1.5px solid var(--good)"></i>Transports<b>${trDone}/${trs.length}</b></span>` : ''}</div></div>`, { p: 'pen-5', meta: `${done} of ${sel.length}` })}
    ${unit('Ready to finish?', `${readyList(checks)}<div class="sideacts">
        <button class="btn pri block" data-a="finish" ${ready ? '' : 'disabled'}>Finish review</button>
        <button class="btn block" data-a="saveProgress">${sharedOn() ? 'Save progress to folder' : 'Save progress file'} <kbd>Ctrl S</kbd></button>
        <button class="btn ghost block" data-a="nav" data-v="report">Preview the document</button>
      </div>`, { p: 'pen-5' })}`;
}

function wikiMarkup(d) {
  const h = d.header, r = d.review;
  const w = s => String(s ?? '').replace(/\r?\n/g, ' ').replace(/\|/g, '/').replace(/([{}[\]])/g, '\\$1').trim() || ' ';
  const st = s => s ? `${STATUS[s].wiki} ${STATUS[s].code}` : ' ';
  const out = [];
  out.push(`h1. Code review — ${w(h.ticket)}${h.title ? ' — ' + w(h.title) : ''}`);
  out.push(`*Status:* ${STAGES[d.stage].label} · *Round:* ${d.round} · *Checklist:* ${w(d.template.name)} v${w(d.template.version)}`, '');
  out.push(`||Module|${w(h.module)}||Check performed by (SAP ID)|${w(who(r.revId, r.revName))}|`);
  out.push(`||Ticket no|${w(h.ticket)}||Review date|${w(fmtDate(r.date))}|`);
  out.push(`||Object name(s)|${w(d.objects.filter(o => o.name).map(o => o.name).join(', '))}||Review effort (person hours)|${w(totalEffort(d))}|`);
  out.push(`||Developer SAP ID|${w(who(h.devId, h.devName))}||Verdict|${d.stage === 'approved' ? '(/) Approved' : d.stage === 'changes' ? '(x) Changes requested' : ' '}|`);
  out.push(`||Creation date|${w(fmtDate(h.created))}||Transport requests|${w(trsOf(d).map(t => t.tr).join(', '))}|`);
  out.push(`||System/Client (development)|${w(splitList(h.devSystem).join(', '))}||Systems/Clients (import)|${w(splitList(h.importSystem).join(', '))}|`, '');
  if (h.summary) out.push('h2. Change description', w(h.summary), '');
  if (trsOf(d).length) {
    out.push('h2. Transport requests', '||Transport request||Source system/client||Developer note||Reviewer checked||Reviewer note||');
    trsOf(d).forEach(t => out.push(`|${w(t.tr)}|${w(t.system)}|${w(t.note)}|${t.checked ? '(/) Checked' : ' '}|${w(t.revNote)}|`));
    out.push('');
  }
  out.push('h2. QA checks', '||#||QA check||Developer review||Developer comments||Reviewer check||Reviewer comments||');
  for (const s of selectedSections(d)) {
    out.push(`|*${w(s.title)}*| | | | | |`);
    for (const i of s.items) {
      const it = d.items[i.id];
      out.push(`|${i.n}|${w(i.text)}${it.by === 'rev' ? ' _(added by reviewer)_' : ''}|${st(it.dev.s)}|${w([it.dev.c, it.reply && 'Response: ' + it.reply].filter(Boolean).join(' — '))}|${st(it.rev.s)}|${w(it.rev.c)}|`);
    }
  }
  if (r.comment) out.push('', 'h2. Reviewer’s overall comment', w(r.comment));
  if (d.backupOn && d.backup.length) {
    out.push('', 'h2. Version backup', '||Object||System||Dev||PreProd||Prod||');
    d.backup.forEach(b => out.push(`|${w(b.object)}|${w(b.system)}|${w(b.dev)}|${w(b.preprod)}|${w(b.prod)}|`));
  }
  if (d.history.length) {
    out.push('', 'h2. History', '||When||Who||Action||Note||');
    d.history.forEach(x => out.push(`|${w(fmtWhen(x.at))}|${w(x.who)}|${w(x.action)}|${w(x.note)}|`));
  }
  return out.join('\n');
}

function render(anim = false) {

  if (doc && DOC_VIEWS.includes(view) && !tabsFor(doc)[view]) view = 'report';
  const host = $('#view'), main = $('#main'), keep = anim ? 0 : main.scrollTop;
  const a = document.activeElement, aid = a && host.contains(a) && a.id ? a.id : '';
  let sel = null; try { sel = aid ? [a.selectionStart, a.selectionEnd] : null; } catch { /* inputs without a caret */ }
  hideTip();
  let html = '';
  try { html = ({ home: vHome, dev: vDev, rev: vRev, report: vReport, checklist: vSetup })[view](); }
  catch (err) { console.error(err); html = `<div class="empty"><b>Something went wrong drawing this page</b><span>${esc(err.message)}</span></div>`; }
  host.classList.toggle('anim', !!anim && !reduced);
  host.innerHTML = html;
  $$('.rise', host).forEach((el, i) => el.style.setProperty('--i', Math.min(i, 12)));
  mountCharts(host, !anim);
  $$('[data-ind]', host).forEach(el => el.indeterminate = true);

  applyFilter();
  main.scrollTop = keep;
  if (aid) { const n = document.getElementById(aid); if (n) { n.focus(); try { if (sel && sel[0] != null) n.setSelectionRange(sel[0], sel[1]); } catch { /* ignore */ } } }
  paintChrome();

  const row = (x, why) => ({ x, html: `<span><b class="mono">${hl(x.ticket || 'Untitled', q)}</b> <span class="dim">${hl(x.title, q)}</span><span class="s">${why || `${esc(x.devName || x.devId || '—')}${x.revName || x.revId ? ' → ' + esc(x.revName || x.revId) : ''}${x.src === 'local' ? ' · only in this browser' : ''}`}</span></span>`, hint: `${STAGES[x.stage]?.label || ''}${x.round > 1 ? ' · R' + x.round : ''}`, pen: STAGES[x.stage]?.pen || 'ink-3', go: open(x) });
  if (!q) {
    const me = myId();
    if (me && sharedOn()) { const qq = queues(me), w = [...qq.changes, ...qq.review].slice(0, 6); if (w.length) { out.push({ grp: 'Waiting on you' }); w.forEach(x => out.push(row({ ...x, src: 'shared' }))); } }
    const recent = pool.slice(0, 6);
    if (recent.length) { out.push({ grp: 'Recent' }); recent.forEach(x => out.push(row(x))); }
    out.push({ grp: 'Actions' }); cmds.forEach(([l, k, f]) => out.push({ cmd: true, html: esc(l), hint: k, go: f }));
  } else {
    const hits = [];
    for (const x of pool) {
      const tk = (x.ticket || '').toLowerCase(); let score = 0, why = '';
      if (tk === ql) score = 100; else if (tk.startsWith(ql)) score = 80; else if (tk.includes(ql)) score = 60;
      else if ((x.title || '').toLowerCase().includes(ql)) score = 50;
      else {
        const o = (x.objs || []).find(v => v.toLowerCase().includes(ql)); const t = (x.trs || []).find(v => v.toLowerCase().includes(ql));
        if (o) { score = 45; why = 'object ' + hl(o, q); } else if (t) { score = 45; why = 'transport ' + hl(t, q); }
        else if ([x.devId, x.devName, x.revId, x.revName, x.asgId, x.asgName].join(' ').toLowerCase().includes(ql)) { score = 30; why = 'person: ' + hl(`${x.devName || x.devId}${x.revName || x.revId ? ' → ' + (x.revName || x.revId) : ''}`, q); }
        else if ((x.module || '').toLowerCase() === ql) { score = 20; why = 'module ' + esc(x.module); }
      }
      if (score) hits.push({ x, score: score + (x.stage !== 'approved' ? 3 : 0), why });
    }
    hits.sort((a, b) => b.score - a.score || (b.x.updatedAt || '').localeCompare(a.x.updatedAt || ''));
    if (hits.length) out.push({ grp: `Reviews · ${hits.length}` });
    hits.slice(0, 14).forEach(h => out.push(row(h.x, h.why)));
    const cm = cmds.filter(([l]) => l.toLowerCase().includes(ql));
    if (cm.length) { out.push({ grp: 'Actions' }); cm.forEach(([l, k, f]) => out.push({ cmd: true, html: hl(l, q), hint: k, go: f })); }
    if (!hits.length && !cm.length) out.push({ grp: sharedOn() ? 'Nothing in the folder or this browser matches' : 'Nothing in this browser matches — connect the shared folder to search the team’s reviews' });
  }
  PAL.items = out.filter(x => !x.grp); PAL.sel = 0;
  let i = 0;
  $('#palRes').innerHTML = out.map(x => x.grp ? `<div class="grp lbl">${esc(x.grp)}</div>` : `<div class="it ${i === 0 ? 'sel' : ''}" data-i="${i++}" style="--pen:${pen(x.pen || 'ink-3')}"><span class="p"></span><span style="min-width:0">${x.html}</span><span class="h">${esc(x.hint || '')}</span></div>`).join('');
  $('#palCount').textContent = q ? `${PAL.items.filter(x => x.x).length} reviews` : '';
  $$('#palRes .it').forEach(el => { el.onmousemove = () => palSel(+el.dataset.i); el.onclick = () => palGo(+el.dataset.i); });
}
function palSel(i) { PAL.sel = i; $$('#palRes .it').forEach(el => el.classList.toggle('sel', +el.dataset.i === i)); $(`#palRes .it[data-i="${i}"]`)?.scrollIntoView({ block: 'nearest' }); }
function palGo(i) { const x = PAL.items[i]; if (!x) return; closePalette(); x.go(); }

  if (e.key === 'ArrowDown') { e.preventDefault(); palSel(Math.min(PAL.items.length - 1, PAL.sel + 1)); }

function applyTheme() {
  let t = store.get('theme', 'system');
  if (t === 'light') t = 'paper'; if (t === 'dark') t = 'backlit';
  const dark = t === 'backlit' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

}

  const order = ['system', 'paper', 'backlit'];
  let t = store.get('theme', 'system'); if (t === 'light') t = 'paper'; if (t === 'dark') t = 'backlit';
  store.set('theme', order[(order.indexOf(t) + 1) % 3]); applyTheme(); render();

}

/* ============================================================ opening reviews */
async function openShared(file) {
  let data;
  try { data = await readShared(file); } catch (e) { return toast(`Couldn’t open ${file}: ${e.message}`, true); }
  const local = store.get('draft.' + data.id);
  if (local && local.shared?.base === data.updatedAt && isUnsaved(local) && (local.updatedAt || '') > (data.updatedAt || '')) {
    const c = await choiceDlg('You have unsaved edits', `This browser has changes to ${data.header?.ticket || 'this review'} from ${fmtWhen(local.updatedAt)} that were never saved to the shared folder.`,
      [{ label: 'Open the shared version', value: 'shared' }, { label: 'Continue my edits', value: 'local', primary: true }]);
    if (!c) return;
    if (c === 'local') return openDocData(local);
  }
  data.shared = { file, base: data.updatedAt };
  if (!data.savedAt) data.savedAt = data.updatedAt;
  openDocData(data);
}
async function openLocal(id) {
  const d = store.get('draft.' + id); if (!d) return;
  if (sharedOn() && d.shared?.file) {
    try {
      const cur = await readShared(d.shared.file);
      if (cur.id === d.id && cur.updatedAt !== d.shared.base) {
        const c = await choiceDlg('The shared folder has a newer version', `${cur.header?.ticket || 'This review'} was saved to the shared folder ${fmtWhen(cur.updatedAt)} (“${STAGES[cur.stage]?.label || cur.stage}”). This browser’s copy is older${isUnsaved(d) ? ' and has changes of its own' : ''}.`,
          [{ label: 'Keep my local copy', value: 'local' }, { label: 'Open the shared version', value: 'shared', primary: true }]);
        if (!c) return;
        if (c === 'shared') { cur.shared = { file: d.shared.file, base: cur.updatedAt }; if (!cur.savedAt) cur.savedAt = cur.updatedAt; return openDocData(cur); }
      }
    } catch { /* not in the folder any more: use the local copy */ }
  }
  doc = migrate(d); ui.collapsed = {};
  const mine = sameId(doc.header.devId, myId());
  go({ draft: 'dev', submitted: mine ? 'dev' : 'rev', changes: 'dev', approved: 'report' }[doc.stage] || 'dev');
}

    const title = `${d.header.ticket}${d.header.title ? ' — ' + d.header.title : ''}`;
    const nFind = selItems(d).filter(([, i]) => i.rev.s === 'N').length;
    if (how === 'shared') return openDlg(d.stage === 'approved'
      ? `<h2>Review approved</h2><p>Saved to <b class="mono">${esc(shared.name)}</b>.${archived ? ` Archive copy: <b class="mono">archive/${esc(archived)}</b> — attach it on Confluence.` : ''}</p>
        ${teamsMsgHtml(`Code review approved: ${title} (round ${d.round}).${archived ? ` Archive: ${shared.name}/archive/${archived}` : ''}`)}
        <div class="dlg-act"><button class="btn" data-a="copyMsg">Copy message</button><button class="btn pri" data-a="closeDlg">Done</button></div>`
      : `<h2>Changes requested</h2><p>Saved to <b class="mono">${esc(shared.name)}</b>. It shows up for ${esc(devWho(d))} under <b>Changes requested on my work</b>.</p>
        ${teamsMsgHtml(`Changes requested on ${title} (round ${d.round}): ${nFind} finding${nFind === 1 ? '' : 's'}. It's in Code Review Desk under "Changes requested on my work".`)}
        <div class="dlg-act"><button class="btn" data-a="copyMsg">Copy message</button><button class="btn pri" data-a="closeDlg">Done</button></div>`);
    openDlg(d.stage === 'approved'
      ? `<h2>Review approved</h2><p>Saved <code>${esc(name)}</code>. Send it back to ${esc(devWho(d))}.</p><p>Whoever archives it can use <b>Copy for Confluence</b> and <b>Archive .html</b> on this page.</p><div class="dlg-act"><button class="btn pri" data-a="closeDlg">Done</button></div>`
      : `<h2>Changes requested</h2><p>Saved <code>${esc(name)}</code>. Send it back to ${esc(devWho(d))}. They open it, fix the flagged checks and resubmit.</p><div class="dlg-act"><button class="btn pri" data-a="closeDlg">Done</button></div>`);
  },

  /* document */
  print() { window.print(); },
  async copyRich() {
    const html = `<style>${REPORT_CSS}</style>` + reportHTML(doc);
    const sheet = $('#sheet');
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([sheet.innerText], { type: 'text/plain' }),
      })]);
      toast('Copied — paste into the Confluence page.');
    } catch {
      const range = document.createRange(); range.selectNodeContents(sheet);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      const ok = document.execCommand('copy'); sel.removeAllRanges();
      toast(ok ? 'Copied — paste into the Confluence page.' : 'Copy was blocked — select the document and press Ctrl+C.', !ok);
    }
  },
  copyWiki() { copyText(wikiMarkup(doc), 'Wiki markup copied — in Confluence use Insert › Markup.'); },
  async dlHtml() { if (await download(fileName(doc, doc.stage === 'approved' ? 'code-review' : STAGES[doc.stage].stamp.toLowerCase().replace(/\s+/g, '-'), 'html'), standaloneHTML(doc), 'text/html')) toast('Archive saved.'); },
  async dlJson() { if (await download(fileName(doc, doc.stage === 'approved' ? 'approved' : doc.stage), JSON.stringify(doc, null, 1), 'application/json')) toast('Saved a copy.'); },

  /* checklist setup */
  tplToggle(el, e) {
    if (e.target.closest('input,button')) return;
    const sec = el.closest('.sec'); const c = !sec.classList.contains('closed');
    sec.classList.toggle('closed', c); ui.tplCollapsed[el.dataset.s] = c;
    if (!c) $$('.titem textarea', sec).forEach(autoGrow);
  },
  tplExpand(el) { TPL.sections.forEach(s => ui.tplCollapsed[s.id] = el.dataset.v === '1'); render(); },
  tplAddType() {
    TPL.objectTypes.push({ id: 'T' + uid().slice(-7).toUpperCase(), label: '', secs: [] });
    tplChanged(); $$('.trow input').at(-1)?.focus();
  },
  tplTypeMove(el) { if (moveIn(TPL.objectTypes, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplTypeDel(el) {
    const o = TPL.objectTypes[+el.dataset.i];
    if (o.label.trim() && !await confirmDlg('Delete object type?', `“${o.label}” will no longer be offered. Reviews that already use it keep its name.`, 'Delete')) return;
    TPL.objectTypes.splice(+el.dataset.i, 1); tplChanged();
  },
  tplTypeSec(el) {
    const o = TPL.objectTypes[+el.dataset.i], id = el.dataset.s;
    o.secs = o.secs.includes(id) ? o.secs.filter(x => x !== id) : TPL.sections.map(s => s.id).filter(x => x === id || o.secs.includes(x));
    saveTpl(); el.setAttribute('aria-pressed', o.secs.includes(id));
  },
  tplAddSec() {
    openDlg(`<h2>New section</h2>
      <label class="field"><span class="k">Section name</span><input class="inp sans" id="newSecName" placeholder="e.g. Workflow / BRF+"></label>
      <div class="dlg-act"><button class="btn" data-a="closeDlg">Cancel</button><button class="btn pri" data-a="tplAddSecGo">Add section</button></div>`);
    const inp = $('#newSecName'); inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') A.tplAddSecGo(); });
  },
  tplAddSecGo() {
    const title = ($('#newSecName')?.value || '').trim();
    if (!title) return $('#newSecName')?.focus();
    const id = newSectionId(title);
    TPL.sections.push({ id, title, next: 2, items: [{ id: `${id}-01`, text: '' }] });
    ui.tplCollapsed[id] = false; closeDlg(); tplChanged();
    $$('.sec').at(-1)?.querySelector('textarea')?.focus();
  },
  tplSecMove(el) { if (moveIn(TPL.sections, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplSecDel(el) {
    const s = TPL.sections[+el.dataset.i];
    if (!await confirmDlg('Delete section?', `“${s.title || 'Untitled section'}” and its ${s.items.length} checks will be removed from the checklist. Reviews already sent are not affected.`, 'Delete section')) return;
    TPL.sections.splice(+el.dataset.i, 1);
    TPL.objectTypes.forEach(o => o.secs = o.secs.filter(x => x !== s.id));
    tplChanged();
  },
  tplAddItem(el) {
    const si = +el.dataset.i, s = TPL.sections[si];
    s.items.push({ id: `${s.id}-${String(s.next).padStart(2, '0')}`, text: '' });
    s.next++; ui.tplCollapsed[s.id] = false; tplChanged();
    $(`[data-t="sections.${si}.items.${s.items.length - 1}.text"]`)?.focus();
  },
  tplItemMove(el) { if (moveIn(TPL.sections[+el.dataset.si].items, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplItemDel(el) {
    const items = TPL.sections[+el.dataset.si].items, it = items[+el.dataset.i];
    if (it.text.trim() && !await confirmDlg('Delete check?', `“${it.text.slice(0, 140)}${it.text.length > 140 ? '…' : ''}”`, 'Delete')) return;
    items.splice(+el.dataset.i, 1); tplChanged();
  },
  async tplExport() {
    const body = JSON.stringify({ app: 'code-review-desk-checklist', schema: 1, exportedAt: nowIso(), tpl: TPL }, null, 1);
    if (await download(`checklist_${safeName(TPL.name)}_v${safeName(TPL.version)}.json`, body, 'application/json')) toast('Checklist exported.');
  },
  async tplBake() {
    if (await download('Code Review Desk.html', bakedHTML(), 'text/html')) toast('Saved — share this copy of the tool with your team.');
  },
  async tplReset() {
    const sharedBase = BASE.source === 'shared';
    if (!await confirmDlg(sharedBase ? 'Discard unpublished changes?' : 'Reset to the built-in checklist?', 'Your changes in this browser will be discarded. Export the checklist first if you want to keep them.', sharedBase ? 'Discard' : 'Reset')) return;
    store.del('template');
    if (sharedBase && shared.newerTpl) { BASE.mod = 0; shared.newerTpl = false; TPL = structuredClone(BASE.tpl); await syncSharedTpl(true); }
    else TPL = structuredClone(BASE.tpl);
    render(); toast(sharedBase ? 'Showing the shared checklist.' : 'Back to the built-in checklist.');
  },
  async tplPublish() {
    if (!sharedOn()) return;
    try {
      let cur = null;
      try { const f = await (await shared.handle.getFileHandle(CHECKLIST_FILE)).getFile(); cur = { mod: f.lastModified, raw: JSON.parse(await f.text()) }; }
      catch (e) { if (e.name !== 'NotFoundError' && !(e instanceof SyntaxError)) throw e; }
      const changedUnderUs = cur && !(BASE.source === 'shared' && cur.mod === BASE.mod) && tplHash(normalizeTpl(cur.raw.tpl || cur.raw)) !== BASE.hash;
      const sameVersion = BASE.source === 'shared' && TPL.version === BASE.tpl.version;
      const ok = changedUnderUs
        ? await confirmDlg('The shared checklist has changed', `${cur.raw.publishedBy || 'Someone'} published a different version${cur.raw.publishedAt ? ' on ' + fmtWhen(cur.raw.publishedAt) : ''} since you loaded it. Publishing replaces it with yours.`, 'Publish anyway')
        : await confirmDlg('Publish checklist?', `Everyone connected to “${shared.name}” will use “${TPL.name}” v${TPL.version} for new reviews. Reviews already sent keep their wording.${sameVersion ? ' The version number is unchanged — consider bumping it first.' : ''}`, 'Publish');
      if (!ok) return;
      const body = { app: 'code-review-desk-checklist', schema: 1, publishedAt: nowIso(), publishedBy: myId(), tpl: TPL };
      await writeText('', CHECKLIST_FILE, JSON.stringify(body, null, 1));
      const f = await (await shared.handle.getFileHandle(CHECKLIST_FILE)).getFile();
      store.del('template'); store.del('template.stale');
      adoptSharedTpl(TPL, f.lastModified);
      Object.assign(shared, { tplExists: true, tplMeta: { publishedAt: body.publishedAt, publishedBy: body.publishedBy }, newerTpl: false });
      render(); toast('Checklist published to the shared folder.');
    } catch (e) { toast(`Couldn’t publish: ${e.message}`, true); }
  },
  tplRestoreStale() { const st = store.get('template.stale'); store.del('template.stale'); if (st?.tpl) { TPL = normalizeTpl(st.tpl); store.set('template', { tpl: TPL, basedOn: BASE.hash, savedAt: nowIso() }); } render(); },
  tplDropStale() { store.del('template.stale'); render(); },
};

/* ============================================================ wiring */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.matches(':disabled')) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) { ui.filter = el.value; applyFilter(); return; }
  if (el.dataset.sq) { ui.sharedQ = el.value; const a = $('#sharedAll'); if (a) a.innerHTML = allReviewsHtml(); return; }
  if (el.dataset.t) { if (el.dataset.t === '__systems') TPL.systems = el.value.split(',').map(x => x.trim()).filter(Boolean); else setPath(TPL, el.dataset.t, el.value); saveTpl(); if (el.tagName === 'TEXTAREA') autoGrow(el); return; }
  const p = el.dataset.b;
  if (!p || !doc) return;
  setPath(doc, p, el.value);
  touched();
  if (el.dataset.rr) render();
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest?.('[data-tagin]'); if (!inp) return;
  if (e.key === 'Enter' || e.key === ',' || e.key === ';') { e.preventDefault(); commitTag(inp); }
  else if (e.key === 'Backspace' && !inp.value) {
    const path = inp.dataset.tagin, vals = splitList(getPath(doc, path));
    if (vals.length) { vals.pop(); setPath(doc, path, vals.join(', ')); paintTags(path); touched(); }
  }
});
document.addEventListener('focusin', e => {
  if (!e.target.dataset?.trsys || !doc) return;
  const opts = [...new Set([...splitList(doc.header.devSystem), ...store.get('sysHistory', [])])];
  const dl = $('#dl-src'); if (dl) dl.innerHTML = opts.map(x => `<option value="${esc(x)}">`).join('');
});
/* Pasting into a transport box: TR numbers are picked out of whatever was copied (a mail, a list, "DEVK900123 – Leave report"). */
document.addEventListener('paste', e => {
  const inp = e.target.closest?.('[data-trin]'); if (!inp || !doc) return;
  const text = e.clipboardData?.getData('text') || '';
  const found = [...new Set((text.match(TR_RE) || []).map(x => x.toUpperCase()))];
  const i = +inp.dataset.trin, row = doc.transports[i];
  if (found.length === 1) {
    const rest = text.replace(TR_RE, '').replace(/^[\s\-–—:|,;]+|[\s\-–—:|,;]+$/g, '').replace(/\s+/g, ' ').trim();
    if (!rest) return;
    e.preventDefault(); row.tr = found[0];
    const asNote = !row.note.trim(); if (asNote) row.note = rest;
    touched(); render(); toast(`Added ${found[0]}${asNote ? ' — the text around it became the note' : ''}.`); return;
  }
  const list = found.length ? found : splitList(text);
  if (list.length < 2) return;
  e.preventDefault();
  row.tr = list[0];
  doc.transports.splice(i + 1, 0, ...list.slice(1).map(tr => ({ ...newTr(), tr, system: row.system })));
  touched(); render(); toast(`Added ${list.length} transports.`);
});
document.addEventListener('focusout', e => { if (e.target.dataset?.tagin) commitTag(e.target); });
document.addEventListener('paste', e => {
  const inp = e.target.closest?.('[data-tagin]'); if (!inp) return;
  const text = e.clipboardData?.getData('text') || '';
  if (/[\s,;]/.test(text.trim())) { e.preventDefault(); inp.value = text; commitTag(inp); }
});
document.addEventListener('mousedown', e => { if (e.target.classList?.contains('tags')) { e.preventDefault(); $('.tag-in', e.target)?.focus(); } });
$('#fileIn').addEventListener('change', e => loadFile(e.target.files[0]));
$('#dlg').addEventListener('close', () => { if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(false); } });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('#dropov').classList.add('on'); } });
document.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#dropov').classList.remove('on'); } });
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#dropov').classList.remove('on'); const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f); });
document.addEventListener('keydown', e => {
  const k = e.key, a = document.activeElement, typing = /INPUT|TEXTAREA|SELECT/.test(a?.tagName) || a?.isContentEditable;
  const palOn = $('#pal').classList.contains('on'), dlgOn = $('#dlg').open;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); palOn ? closePalette() : openPalette(); return; }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 's') {
    e.preventDefault();
    if (dlgOn || !doc) return;
    if (view === 'dev' && devEditable(doc)) A.saveDraft(); else if (view === 'rev') A.saveProgress();
    return;
  }
  if (k === 'Escape' && palOn) { closePalette(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || palOn || dlgOn) return;
  const lk = k.toLowerCase();
  if (lk === 'n') { e.preventDefault(); A.newReview(); }
  else if (lk === 'o') { e.preventDefault(); A.openFile(); }
  else if (k === '/') { e.preventDefault(); openPalette(); }
  else if (/^[1-5]$/.test(k)) { const v = ['home', 'dev', 'rev', 'report', 'checklist'][+k - 1]; if (!DOC_VIEWS.includes(v) || (doc && tabsFor(doc)[v])) go(v); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) sharedRefresh(true); });
setInterval(() => { if (!document.hidden && view === 'home') sharedRefresh(true); }, 60000);
addEventListener('resize', () => paintChrome());

$('#rpcss').textContent = REPORT_CSS;
applyTheme();
pruneLocal();
render(true);
sharedInit();
</script>
</body>
