<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Review Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#f8f9fb; --ink:#1b2130; --muted:#5e6778; --faint:#8a93a3;
  --line:#dde1e8; --line-2:#e9ecf1; --accent:#2f5bd3; --accent-2:#e7eefc; --accent-ink:#fff;
  --ok:#1b7a4a; --ok-bg:#e2f3e9; --bad:#b3261e; --bad-bg:#fbe8e6; --na:#5e6778; --na-bg:#eceef2;
  --warn:#8a5a00; --warn-bg:#fff2d4; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#181c24; --panel-2:#1d222c; --ink:#e6e9ef; --muted:#a0a8b8; --faint:#737c8d;
    --line:#2b313d; --line-2:#242a35; --accent:#7ea2ff; --accent-2:#1f2a44; --accent-ink:#0d1220;
    --ok:#5fd08f; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1c1a; --na:#a0a8b8; --na-bg:#262b35;
    --warn:#f2c35b; --warn-bg:#352a12; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#181c24; --panel-2:#1d222c; --ink:#e6e9ef; --muted:#a0a8b8; --faint:#737c8d;
  --line:#2b313d; --line-2:#242a35; --accent:#7ea2ff; --accent-2:#1f2a44; --accent-ink:#0d1220;
  --ok:#5fd08f; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1c1a; --na:#a0a8b8; --na-bg:#262b35;
  --warn:#f2c35b; --warn-bg:#352a12; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono,code{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace}
a{color:var(--accent)}

/* top bar */
#top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;cursor:pointer;background:none;border:0;padding:0}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand .mk svg{width:16px;height:16px}
.ctx{display:flex;align-items:center;gap:8px;min-width:0}
.ctx .tk{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%}
.icon{border:0;background:none;cursor:pointer;color:var(--faint);padding:2px 6px;border-radius:6px}
.icon:hover{color:var(--bad);background:var(--bad-bg)}

.pill{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.03em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.draft{background:var(--na-bg);color:var(--na)}
.pill.submitted{background:var(--warn-bg);color:var(--warn)}
.pill.changes{background:var(--bad-bg);color:var(--bad)}
.pill.approved{background:var(--ok-bg);color:var(--ok)}

main{max-width:1320px;margin:0 auto;padding:20px 16px 80px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:12px}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:9px}
.card h2 .step{width:22px;height:22px;border-radius:50%;background:var(--accent-2);color:var(--accent);font-size:12px;display:grid;place-items:center;flex:none}
.card h2 .aside{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:550}
.fld small{color:var(--faint);font-size:12px}
.req{color:var(--bad);font-style:normal}
input[type=text],input[type=date],input[type=number],input[type=search],input:not([type]),select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

table.ed{width:100%;border-collapse:collapse}
table.ed th{font-size:12px;color:var(--muted);font-weight:550;text-align:left;padding:0 6px 6px}
table.ed td{padding:3px 4px;vertical-align:middle}
table.ed td:last-child{width:34px;text-align:center}
.tbl-wrap{overflow-x:auto}

.banner{border-radius:10px;padding:12px 14px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.banner>div>b:first-child{display:block;margin-bottom:2px}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-bg);border-color:transparent}
.banner.ok{background:var(--ok-bg);border-color:transparent}
.banner.info{background:var(--accent-2);border-color:transparent}
.banner .bi{font-size:18px;line-height:1.1}

/* checklist */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{max-width:260px}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
.sugline{margin:0 0 12px;font-size:13px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel-2);cursor:pointer;user-select:none}
.sec-h h3{margin:0;font-size:14.5px}
.sec-h .cnt{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sec-h .chev{transition:transform .15s;color:var(--faint)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.filtering .sec.closed .sec-b{display:block}
.sec-b{border-top:1px solid var(--line)}
.badge{font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--accent-2);color:var(--accent);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.item{padding:9px 12px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item.on{background:color-mix(in srgb,var(--accent-2) 45%,transparent)}
.item[hidden]{display:none}
.item-top{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.rv .item-top{cursor:default}
.item-top input{margin-top:3px;flex:none}
.item-top .num{flex:none;min-width:24px;text-align:right;font:12px/1.9 "Cascadia Mono",Consolas,monospace;color:var(--faint)}
.item-top .txt{flex:1}
.item-x{margin:8px 0 2px 57px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item-x .cmt{flex:1;min-width:220px}
.revnote{flex-basis:100%;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--panel);border:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.ok[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);font-weight:650}
.seg button.bad[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad);font-weight:650}
.seg button.na[aria-pressed="true"]{background:var(--na-bg);color:var(--ink);font-weight:650}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:1px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.na{background:var(--na-bg);color:var(--na)} .chip.none{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 2px 33px}
@media (max-width:700px){.rv-grid{grid-template-columns:1fr;margin-left:0}.item-x{margin-left:0}}
.rv-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.rv-col .cmt{width:100%}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650}
.cm{margin:0;font-size:13.5px;white-space:pre-wrap}
.prev{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.rv.st-N{box-shadow:inset 3px 0 0 var(--bad)}
.rv.st-F{box-shadow:inset 3px 0 0 var(--ok)}
.rv.st-NA{box-shadow:inset 3px 0 0 var(--na)}
.filters{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.filters button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
.filters button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-weight:560;overflow-wrap:anywhere}
.summary{white-space:pre-wrap;margin:12px 0 0;padding:10px 12px;background:var(--panel-2);border-radius:8px}
table.ro{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
table.ro th,table.ro td{border-bottom:1px solid var(--line-2);padding:5px 6px;text-align:left;vertical-align:top}
table.ro th{font-size:12px;color:var(--muted);font-weight:550}

.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media (max-width:560px){.verdict{grid-template-columns:1fr}}
.vbtn{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:650}
.vbtn small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.vbtn.ok[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.vbtn.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* rail */
.rail .card{padding:14px}
.rail h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.ready{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.ready li{display:flex;gap:7px;align-items:flex-start}
.ready li::before{content:"";flex:none;width:15px;height:15px;margin-top:2px;border-radius:50%;border:1.5px solid var(--faint)}
.ready li.ok{color:var(--muted)}
.ready li.ok::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2.5px var(--panel)}
.ready li.soft::before{border-color:var(--warn);border-style:dashed}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:7px}
.secsum{list-style:none;margin:0;padding:0;font-size:13px}
.secsum li{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
.secsum li b{color:var(--ink);font-weight:600}

/* home */
.hero{padding:26px 0 18px}
.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);max-width:720px;font-size:15px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
@media (max-width:760px){.choices{grid-template-columns:1fr}}
.choice{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.choice h2{margin:0 !important}
.choice p{margin:0 0 6px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;width:100%;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel-2)}
body.dragging .drop,.drop:hover{border-color:var(--accent);color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:f}
@media (max-width:860px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.flow{grid-template-columns:1fr}}
.flow div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.flow div b{display:block;margin-bottom:3px}
.flow div::before{counter-increment:f;content:counter(f);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;margin-bottom:6px}
.drafts{width:100%;border-collapse:collapse}
.drafts td{padding:8px 6px;border-top:1px solid var(--line-2);vertical-align:middle}
.drafts tr:first-child td{border-top:0}
.drafts td:last-child{text-align:right;white-space:nowrap}
h3.h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:26px 0 10px}

/* report */
.rp-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.paper{background:#fff;color:#1d2330;border-radius:6px;box-shadow:0 2px 20px rgba(0,0,0,.12);padding:28px 30px;overflow-x:auto}
.archive{margin-bottom:14px}
.archive ol{margin:6px 0 0;padding-left:20px}

/* shared folder */
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);flex:none;margin-right:7px}
.sdot.big{width:11px;height:11px;box-shadow:0 0 0 4px var(--ok-bg);margin-right:4px}
.spill .count{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px;line-height:1.5}
.warnbtn{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:600}
.sbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.sbar-main{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}
.sme{width:200px}
.sbar-act{display:flex;gap:6px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:860px){.buckets{grid-template-columns:1fr}}
.bucket{padding:14px 16px}
.bucket h3{margin:0 0 2px;font-size:15px;display:flex;gap:8px;align-items:center}
.bucket .badge.muted{background:var(--na-bg);color:var(--na)}
.bucket .hint{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.qlist{display:flex;flex-direction:column}
.qrow{display:flex;justify-content:space-between;gap:12px;padding:8px 8px;border-top:1px solid var(--line-2);cursor:pointer;border-radius:6px}
.qrow:first-child{border-top:0}
.qrow:hover{background:var(--accent-2)}
.qmain{min-width:0;overflow-wrap:anywhere}
.qside{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.allhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.allhead h3{margin:0}
.allhead input{max-width:300px}
.connect{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.steps{margin:8px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.msgbox{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}

/* transports (reviewer) */
.trlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tritem{display:flex;gap:12px;padding:10px 12px;border-top:1px solid var(--line-2);align-items:flex-start}
.tritem:first-child{border-top:0}
.tritem.done{background:color-mix(in srgb,var(--ok-bg) 60%,transparent)}
.trchk{padding-top:4px;cursor:pointer}
.trchk input{width:18px;height:18px;cursor:pointer;accent-color:var(--ok)}
.trmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.trhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trno{font-weight:700;font-size:15px}
.tritem.done .trno{color:var(--ok)}

/* multi-value system fields */
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:4px 6px;min-height:36px;cursor:text}
.tags:focus-within{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.tag{display:inline-flex;align-items:center;background:var(--accent-2);color:var(--accent);border-radius:6px;padding:2px 0 2px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.tag-x{border:0;background:none;color:inherit;cursor:pointer;padding:0 6px;opacity:.55;font-size:11px}
.tag-x:hover{opacity:1}
.tags .tag-in{flex:1;min-width:110px;width:auto;border:0;background:transparent;padding:3px 4px}
.tags .tag-in:focus{outline:none}

/* checklist setup */
.setup{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tplstate{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.how{margin-top:14px;font-size:13.5px}
.how summary{cursor:pointer;color:var(--accent)}
.how p{margin:8px 0 0}
.trow{display:grid;grid-template-columns:minmax(170px,250px) minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line-2)}
.trow:first-child{border-top:0}
@media (max-width:720px){.trow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tchip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--accent);font-weight:600}
.tchip[aria-pressed="true"]::before{content:"✓ "}
.rowbtns{display:flex;gap:1px;flex:none}
.icon.mv:hover{color:var(--accent);background:var(--accent-2)}
.icon:disabled{opacity:.25;cursor:default;background:none !important;color:var(--faint) !important}
.sec-h .sec-title{font-weight:650;flex:1;max-width:460px;background:transparent;border-color:transparent;padding:4px 8px}
.sec-h .sec-title:hover{border-color:var(--line)}
.sec-h .sec-title:focus{background:var(--panel)}
.card h2 .aside .btn{margin-left:4px}
.titem{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 12px;border-top:1px solid var(--line-2)}
.titem:first-child{border-top:0}
.titem .num{font:12px/2.6 Consolas,monospace;color:var(--faint);text-align:right}
.titem textarea{resize:none;overflow:hidden;min-height:34px;line-height:1.4}
.titem.add{display:block;padding:9px 12px 9px 46px}
.setupnote{font-size:13px;margin:10px 0 0}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);max-width:min(720px,calc(100vw - 32px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.dlg-in{padding:20px 22px}
.dlg-in h2{margin:0 0 8px;font-size:17px}
.dlg-list{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:12px 0}
.dlg-list h4{margin:12px 0 4px;font-size:13px;color:var(--muted)}
.pick{display:flex;gap:8px;padding:5px 0;align-items:flex-start;cursor:pointer;font-size:13.5px}
.pick input{margin-top:3px}
.pick .num{font:12px/1.8 Consolas,monospace;color:var(--faint);min-width:20px;text-align:right}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg-in code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:12.5px;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:100;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad);color:#fff}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  #top,.rp-bar,.archive,#toast{display:none !important}
  main{padding:0;max-width:none}
  .paper{box-shadow:none;padding:0;border-radius:0;overflow:visible}
}

     "id": "GEN-03",

     "id": "GEN-04",

    {
     "id": "GEN-05",

     "id": "GEN-06",
     "text": "Naming standards, appropriate message class / development class / transport naming convention / program header / modification history have been checked."
    },
    {
     "id": "GEN-07",
     "text": "Program documentation is maintained for any object modification. All changes are maintained with a search term so that the change can be tracked with the ticket no."
    },
    {
     "id": "GEN-08",
     "text": "Appropriate comments, logic and reasoning are mentioned for code which is commented out."

    {
     "id": "GEN-09",
     "text": "Obsolete statements are not used: RANGE, INCLUDE STRUCTURE, TABLES (except for module pool), BEGIN .. OCCURS."

    {
     "id": "GEN-10",
     "text": "Global variables are minimized by declaring local variables or by passing variables through parameters and arguments while creating internal subroutines."
    },
    {
     "id": "GEN-11",
     "text": "Remove dead code, perform Extended Checks / Code Inspector and do Pretty Print."
    },
    {
     "id": "GEN-12",
     "text": "Runtime analysis (SE30) and SQL Trace (ST05) have been done for complex reports to check the performance of the program and database time taken."
    },
    {
     "id": "GEN-13",
     "text": "Do not use nested IF..ELSEIF… instead use CASE..ENDCASE wherever applicable. When coding IF or CASE, testing conditions are nested so that the most frequently true conditions are processed first."
    },
    {
     "id": "GEN-14",
     "text": "Sort fields on the SORT statement are not left as default (i.e. SORT ITAB BY FLD1 instead of SORT ITAB). Sort the internal table before using the “BINARY SEARCH” feature."
    },
    {
     "id": "GEN-15",
     "text": "Use a field symbol when modifying data in an internal table instead of a work area. Do not declare field symbols with type ANY."
    },
    {
     "id": "GEN-16",
     "text": "Has the internal table used in “FOR ALL ENTRIES IN” been checked for emptiness?"
    },
    {
     "id": "GEN-17",
     "text": "Are all SELECTs coded outside LOOP - ENDLOOP?"
    },
    {
     "id": "GEN-18",
     "text": "DEQUEUE is issued on ENQUEUEd records/tables if you are in the middle of a transaction that does not end the LUW. (Locks are released automatically by LEAVE PROGRAM, LEAVE TO TRANSACTION, or A / X message types.)"
    },
    {
     "id": "GEN-19",
     "text": "Avoid hard coding."
    },
    {
     "id": "GEN-20",
     "text": "If new tables/reports are created as part of the development, the authorization group is assigned."
    },
    {
     "id": "GEN-21",
     "text": "When calling a class method, the object reference is checked (IF lo_obj_ref IS NOT INITIAL…)."
    },
    {
     "id": "GEN-22",
     "text": "TRY … ENDTRY block is used if the called method raises exceptions."
    },
    {
     "id": "GEN-23",
     "text": "A CATCH block is defined for each and every exception defined for that method."
    },
    {
     "id": "GEN-24",
     "text": "Method get_text() is called to capture the error message of the raised exception and it is reported properly."
    },
    {
     "id": "GEN-25",
     "text": "Methods are not called without handling their exceptions."
    }
   ]
  },
  {
   "id": "DAT",
   "title": "Data Access and HR related Checks",
   "next": 12,
   "items": [
    {
     "id": "DAT-01",
     "text": "Use SAP standard function modules wherever applicable, e.g. “HR_READ_INFOTYPE”, “HR_INFOTYPE_OPERATION”."
    },
    {
     "id": "DAT-02",
     "text": "Use standard HR logical databases like PNP, PCH wherever applicable."
    },
    {
     "id": "DAT-03",
     "text": "Authorization is checked when reading infotype data."
    },
    {
     "id": "DAT-04",
     "text": "No SELECT statement within a GET event."
    },
    {
     "id": "DAT-05",
     "text": "SELECT SINGLE is used only when all primary key fields are in the WHERE clause, otherwise SELECT … UP TO 1 ROWS."
    },
    {
     "id": "DAT-06",
     "text": "No nested SELECT. Use INNER JOIN and/or FOR ALL ENTRIES wherever applicable, check the driver table has data, retrieve all key fields and remove duplicates."
    },
    {
     "id": "DAT-07",
     "text": "Use SELECT … INTO TABLE instead of INTO CORRESPONDING FIELDS OF."
    },
    {
     "id": "DAT-08",
     "text": "When processing internal tables, the work area is cleared before it is filled, e.g. in a loop (LOOP AT …, SELECT … ENDSELECT), in particular with MOVE-CORRESPONDING or INTO CORRESPONDING FIELDS OF."
    },
    {
     "id": "DAT-09",
     "text": "Use a field symbol when modifying data in an internal table instead of a work area."
    },
    {
     "id": "DAT-10",
     "text": "Language key is passed when reading text descriptions. When displaying amount fields, the currency field is aligned."
    },
    {
     "id": "DAT-11",
     "text": "Data is not retrieved using non-primary-key fields — use the primary key or a secondary index, following the order of the key/index fields in the WHERE clause."
    }
   ]
  },
  {
   "id": "REP",
   "title": "Report Standard",
   "next": 5,
   "items": [
    {
     "id": "REP-01",
     "text": "Error handling is done properly — instead of an error message, an information message and “LEAVE LIST-PROCESSING” can be used to return to the selection screen."
    },
    {
     "id": "REP-02",
     "text": "For ALV reports the field catalog is built from dictionary properties rather than hard-coded field names. If hard coding is required for text, a text element/message is used (never a constant) so it can be translated."
    },
    {
     "id": "REP-03",
     "text": "ALV class approach is used rather than the function module approach."
    },
    {
     "id": "REP-04",
     "text": "If the report can run in background, error/abend messages are replaced by information/warning/success messages so the job is not shown as cancelled to BASIS. Ground rule: no hard error message in background processing."
    }
   ]
  },
  {
   "id": "ONL",
   "title": "Online Standard",
   "next": 7,
   "items": [
    {
     "id": "ONL-01",
     "text": "The field with “OK” format is defined as OK_CODE."
    },
    {
     "id": "ONL-02",
     "text": "When handling a lock entry failure, an error message (type E) is raised to prevent the user from leaving the screen."
    },
    {
     "id": "ONL-03",
     "text": "AT USER-COMMAND with a dialog status is used instead of AT PFnn in the program."
    },
    {
     "id": "ONL-04",
     "text": "Flag variables used to set screen properties / program logic are not changed locally — they are passed by value to subroutines and documented."
    },
    {
     "id": "ONL-05",
     "text": "No error message in PBO."
    },
    {
     "id": "ONL-06",
     "text": "Basic buttons like “CANCEL”, “BACK”, “EXIT” always work by default."
    }
   ]
  },
  {
   "id": "BAT",
   "title": "Batch Program / Interface Standard",
   "next": 11,
   "items": [
    {
     "id": "BAT-01",
     "text": "Function module AUTHORITY_CHECK_DATASET is called before opening a file to check the user's authorization for OPEN / READ / TRANSFER / DELETE DATASET."
    },
    {
     "id": "BAT-02",
     "text": "The dataset is OPENed before read/write operations and always explicitly CLOSEd when file processing is finished."
    },
    {
     "id": "BAT-03",
     "text": "COMMIT WORK is used for database updates, and ROLLBACK wherever applicable."
    },
    {
     "id": "BAT-04",
     "text": "Tables are locked during database updates and unlocked once the update is done."
    },
    {
     "id": "BAT-05",
     "text": "“Success” messages (type S, written to the job log in batch) are used generously to provide an audit trail of the program’s execution."
    },
    {
     "id": "BAT-06",
     "text": "For outbound IDocs, non-character values passed to the IDoc are CONDENSEd in the target field."
    },
    {
     "id": "BAT-07",
     "text": "SY-SUBRC is not checked after CALL TRANSACTION — the BDC message return table is checked instead."
    },
    {
     "id": "BAT-08",
     "text": "When using BAPIs to create/change database entries, the RETURN table is checked instead of SY-SUBRC, and BAPI_TRANSACTION_COMMIT is used to commit."
    },
    {
     "id": "BAT-09",
     "text": "The CALL TRANSACTION mode is declared as a variable, not a constant, so it can be changed while debugging."
    },
    {
     "id": "BAT-10",
     "text": "For BDC, “WRITE TO” is used to apply the logon user’s defaults for date/currency/decimal fields, and conversion exit ALPHA output is used where internal/external formats differ."
    }
   ]
  },
  {
   "id": "FRM",
   "title": "SAPscript / Smart Forms",
   "next": 11,
   "items": [
    {
     "id": "FRM-01",
     "text": "Nice to have: program header flower box in a window of the SAPscript, and in the initialization section for Smart Forms. If an external subroutine pool is used, its header flower box must be filled."
    },
    {
     "id": "FRM-02",
     "text": "Smart Forms: text modules are used instead of hard coding."
    },
    {
     "id": "FRM-03",
     "text": "Standard texts are used where the text changes from time to time (greetings, footer etc.)."
    },
    {
     "id": "FRM-04",
     "text": "No spacing is used for alignment — paragraph formats and tabs are used."
    },
    {
     "id": "FRM-05",
     "text": "Currency fields are formatted when displaying amounts in the layout."
    },
    {
     "id": "FRM-06",
     "text": "Language is not SY-LANGU in most cases — rather NAST-LANGU / the recipient’s language."
    },
    {
     "id": "FRM-07",
     "text": "A printout of the layout was taken in the paper size specified in the form header to check accuracy."
    },
    {
     "id": "FRM-08",
     "text": "Relevant standard texts for SAPscript are transferred to a correction request (standard program RSTXTRAN)."
    },
    {
     "id": "FRM-09",
     "text": "PROTECT … ENDPROTECT is used to avoid unwanted breaking of text across pages."
    },
    {
     "id": "FRM-10",
     "text": "Form has been tested with the appropriate printer and device type."
    }
   ]
  }
 ],
 "objectTypes": [

<script>
'use strict';
/* Checklist template: read from the JSON block <script id="crd-template"> above.
   Edit it in the app via "Checklist setup", then "Download tool with this checklist". */
const BUILTIN_TPL = JSON.parse(document.getElementById('crd-template').textContent);
/* Pristine copy of this page, captured before anything renders, for "Download tool with this checklist". */
const BASE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
const STATUS = {
  F:  { label: 'Followed',       short: 'Followed',     code: '1-Followed',       cls: 'ok', mark: '✔', wiki: '(/)' },
  N:  { label: 'Not followed',   short: 'Not followed', code: '0-Not followed',   cls: 'bad', mark: '✖', wiki: '(x)' },
  NA: { label: 'Not applicable', short: 'N/A',          code: '2-Not applicable', cls: 'na', mark: '–', wiki: '(i)' },
};
const MODULES = ['PA', 'OM', 'PY', 'PT', 'PD', 'PB', 'TM', 'ESS/MSS', 'CATS', 'ECP', 'FI', 'CO', 'MM', 'SD', 'Cross-module'];
const STAGES = {
  draft:     { label: 'Draft',             stamp: 'DRAFT' },
  submitted: { label: 'In review',         stamp: 'IN REVIEW' },
  changes:   { label: 'Changes requested', stamp: 'CHANGES REQUESTED' },
  approved:  { label: 'Approved',          stamp: 'APPROVED' },
};

/* ============================================================ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = iso => iso ? iso.slice(0, 10).split('-').reverse().join('.') : '';
const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const splitList = s => String(s || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);

const store = {
  get(k, d) { try { const v = localStorage.getItem('crd.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('crd.' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem('crd.' + k); } catch { /* ignore */ } },
  keys(prefix) { try { return Object.keys(localStorage).filter(k => k.startsWith('crd.' + prefix)).map(k => k.slice(4)); } catch { return []; } },
};

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks.at(-1)] = v;
}

/* Tamper-evidence fingerprint (not a cryptographic signature). */
function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const isThisRoundRevAdd = (d, it) => it && it.by === 'rev' && it.addedRound === d.round;
function devSealOf(d) {
  const items = {};
  for (const [id, it] of Object.entries(d.items)) if (it.sel && !isThisRoundRevAdd(d, it)) items[id] = { dev: it.dev, reply: it.reply || '' };
  return hash(stable({
    h: d.header, o: d.objects, b: d.backupOn ? d.backup : [], r: d.round, p: d.pastRounds,
    c: d.checklist.filter(x => !isThisRoundRevAdd(d, d.items[x.id])).map(x => [x.id, x.text]), i: items,
    ...(d.schema >= 2 ? { t: trsOf(d).map(t => [t.tr, t.system, t.note]) } : {}),
  }));
}
function revSealOf(d) {
  const items = {};
  for (const [id, it] of Object.entries(d.items)) if (it.sel) items[id] = it.rev;
  return hash(stable({ dev: d.seals.dev, rv: d.review, i: items, r: d.round, ...(d.schema >= 2 ? { tc: trsOf(d).map(t => [!!t.checked, t.revNote]) } : {}) }));
}

/* ============================================================ checklist template */
const tplHash = t => hash(stable({ n: t.name, v: t.version, sy: t.systems, s: t.sections, o: t.objectTypes }));
const BUILTIN_HASH = tplHash(BUILTIN_TPL);
function normalizeTpl(t) {
  const out = {
    name: String(t?.name || 'Code Review Checklist'), version: String(t?.version || '1'),
    systems: Array.isArray(t?.systems) ? t.systems.map(String) : [],
    sections: (t?.sections || []).map(s => ({
      id: String(s.id), title: String(s.title ?? ''),
      next: +s.next || (s.items?.length || 0) + 1,
      items: (s.items || []).map(i => ({ id: String(i.id), text: String(i.text ?? '') })),
    })),
    objectTypes: (t?.objectTypes || []).map(o => ({ id: String(o.id), label: String(o.label ?? ''), secs: (o.secs || []).map(String) })),
  };
  for (const s of out.sections) {
    const maxN = Math.max(0, ...s.items.map(i => +String(i.id).split('-').pop() || 0));
    s.next = Math.max(s.next, maxN + 1);
  }
  return out;
}
/* BASE is the checklist everyone starts from: the one built into this file, or the shared folder's checklist.json once connected.
   Edits live in this browser (crd.template, tagged with the BASE they were made against) until published or baked into a copy of the tool. */
let BASE = { tpl: normalizeTpl(BUILTIN_TPL), hash: BUILTIN_HASH, source: 'builtin', mod: 0 };
let TPL = (() => {
  const saved = store.get('template');
  if (!saved?.tpl) return structuredClone(BASE.tpl);
  const t = normalizeTpl(saved.tpl);
  if (tplHash(t) === BUILTIN_HASH) { store.del('template'); return structuredClone(BASE.tpl); }
  return t;
})();
const tplIsCustom = () => tplHash(TPL) !== BASE.hash;
const tplBasedOnOld = () => { const s = store.get('template'); return BASE.source === 'builtin' && tplIsCustom() && s?.basedOn && s.basedOn !== BUILTIN_HASH; };
let tplSaveT;
function saveTpl() {
  clearTimeout(tplSaveT);
  tplSaveT = setTimeout(() => {
    if (tplIsCustom()) store.set('template', { tpl: TPL, basedOn: store.get('template')?.basedOn || BASE.hash, savedAt: nowIso() });
    else store.del('template');
    const st = $('#tplState'); if (st) st.innerHTML = tplStateHtml();
    const ac = $('#tplActions'); if (ac) ac.innerHTML = tplActionsHtml();
  }, 250);
}
/* Switch BASE to the shared checklist. Local edits survive only if they were made against this exact shared version. */
function adoptSharedTpl(raw, mod) {
  const t = normalizeTpl(raw), h = tplHash(t);
  BASE = { tpl: t, hash: h, source: 'shared', mod };
  const draft = store.get('template');
  const draftHash = draft?.tpl ? tplHash(normalizeTpl(draft.tpl)) : '';
  if (draft?.tpl && draft.basedOn === h && draftHash !== h) { TPL = normalizeTpl(draft.tpl); return; }
  if (draft?.tpl && draftHash !== h && draftHash !== BUILTIN_HASH) store.set('template.stale', draft);
  store.del('template');
  TPL = structuredClone(t);
}
const typeLabelOf = o => TPL.objectTypes.find(t => t.id === o.type)?.label || o.typeLabel || '';
function tplSections() {
  return TPL.sections.map(s => ({
    id: s.id, title: s.title.trim() || 'Untitled section',
    items: s.items.filter(i => i.text.trim()).map((i, k) => ({ id: i.id, text: i.text.trim(), n: k + 1 })),
  }));
}
function newSectionId(title) {
  const base = (String(title).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'SEC');
  const used = new Set([...TPL.sections.map(s => s.id), ...BUILTIN_TPL.sections.map(s => s.id)]);
  if (!used.has(base)) return base;
  for (let k = 2; ; k++) if (!used.has(base + k)) return base + k;
}

function newDoc() {

    header: {

      devId: me.devId || '', devName: me.devName || '', created: todayLocal(),
      devSystem: me.devSystem || '', importSystem: me.importSystem || '', transports: '',
    },
    objects: [{ name: '', type: '', note: '' }],
    transports: [newTr()],
    assignee: { id: '', name: '' },
    backupOn: false, backup: [],
    items: {}, checklist: [],
    review: { revId: '', revName: '', date: '', effort: '', verdict: '', comment: '' },
    history: [], pastRounds: [], seals: { dev: '', rev: '' },
  };
}
function migrate(d) {
  const base = newDoc();
  const out = { ...base, ...d };
  out.header = { ...base.header, ...(d.header || {}) };
  out.review = { ...base.review, ...(d.review || {}) };
  out.seals = { ...base.seals, ...(d.seals || {}) };
  out.assignee = { ...base.assignee, ...(d.assignee || {}) };
  out.template = d.template || base.template;
  for (const k of ['objects', 'backup', 'checklist', 'history', 'pastRounds']) if (!Array.isArray(out[k])) out[k] = [];
  if (!out.objects.length) out.objects.push({ name: '', type: '', note: '' });
  out.schema = +d.schema || 1;
  /* Schema 1 kept transports as a comma-separated header string; header.transports is left untouched so old fingerprints still match. */
  out.transports = (Array.isArray(d.transports) ? d.transports : splitList(out.header.transports).map(tr => ({ tr, system: splitList(out.header.devSystem)[0] || '' })))
    .map(t => ({ ...newTr(), ...t, checked: !!t.checked }));
  if (!out.transports.length) out.transports.push(newTr());
  out.items = out.items || {};
  for (const it of Object.values(out.items)) {
    it.dev = { s: '', c: '', ...(it.dev || {}) };
    it.rev = { s: '', c: '', ...(it.rev || {}) };
    it.reply = it.reply || '';
    it.by = it.by || 'dev';
  }
  return out;
}
function newTr() { return { tr: '', system: '', note: '', checked: false, revNote: '' }; }
const trsOf = d => (d.transports || []).filter(t => t.tr.trim());
/* Before a developer save: drop empty rows, tidy TR numbers, default the source system to the first development system. */
function tidyTransports(d) {
  const src = splitList(d.header.devSystem)[0] || '';
  d.transports = d.transports.filter(t => t.tr.trim() || t.note.trim()).map(t => ({ ...t, tr: t.tr.trim().toUpperCase(), system: t.system.trim() || src }));
  if (d.schema < 2) { d.schema = 2; d.header.transports = ''; }
}
const ensureItem = id => (doc.items[id] ||= { sel: false, by: 'dev', dev: { s: '', c: '' }, rev: { s: '', c: '' }, reply: '' });

/* Which checks a review can show.
   Draft: this browser's checklist wins; ticked checks that have since been removed from it survive from the file's snapshot.
   After submission: the file's snapshot wins (so the reviewer sees exactly what was sent, whatever checklist their copy has),
   followed by this checklist's remaining checks (for "add a check the developer missed"). */
function sectionsFor(d) {
  const tpl = tplSections();
  const snap = d?.checklist || [];
  if (!d || d.stage === 'draft') {
    for (const c of snap) {
      if (tpl.some(s => s.items.some(i => i.id === c.id))) continue;
      let s = tpl.find(x => x.id === c.sec);
      if (!s) { s = { id: c.sec, title: c.secTitle || c.sec, items: [] }; tpl.push(s); }
      s.items.push({ id: c.id, text: c.text, n: s.items.length + 1 });
    }
    return tpl;
  }
  const secs = [];
  for (const c of snap) {
    let s = secs.find(x => x.id === c.sec);
    if (!s) { s = { id: c.sec, title: c.secTitle || c.sec, items: [] }; secs.push(s); }
    s.items.push({ id: c.id, text: c.text, n: c.n });
  }
  const have = new Set(snap.map(c => c.id));
  for (const t of tpl) {
    const extra = t.items.filter(i => !have.has(i.id));
    if (!extra.length) continue;
    let s = secs.find(x => x.id === t.id);
    if (!s) { s = { id: t.id, title: t.title, items: [] }; secs.push(s); }
    s.items.push(...extra);
  }
  return secs;
}
function selectedSections(d) {
  return sectionsFor(d).map(s => ({ ...s, items: s.items.filter(i => d.items[i.id]?.sel) })).filter(s => s.items.length);
}
function snapshot(d) {
  d.checklist = selectedSections(d).flatMap(s => s.items.map(i => ({ id: i.id, sec: s.id, secTitle: s.title, n: i.n, text: i.text })));
}
/* Developer-side only: record type labels so a reviewer whose checklist lacks a type still sees its name. */
function stampTypeLabels(d) { d.objects.forEach(o => { o.typeLabel = typeLabelOf(o); }); }
const selItems = d => selectedSections(d).flatMap(s => s.items.map(i => [i.id, d.items[i.id]]));
const suggestedSecs = d => new Set(d.objects.flatMap(o => TPL.objectTypes.find(t => t.id === o.type)?.secs || []));
const who = (id, name) => [id, name ? `(${name})` : ''].filter(Boolean).join(' ');
const devWho = d => who(d.header.devId, d.header.devName) || 'Developer';
const revWho = d => who(d.review.revId, d.review.revName) || 'Reviewer';
const safeName = s => String(s || '').trim().replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '') || 'untitled';
const fileName = (d, suffix, ext = 'json') => `CR_${safeName(d.header.ticket)}_R${d.round}_${suffix}.${ext}`;
function totalEffort(d) {
  const n = [...d.pastRounds.map(r => r.review?.effort), d.review.effort].map(x => parseFloat(x)).filter(x => !isNaN(x));
  return n.length ? +n.reduce((a, b) => a + b, 0).toFixed(2) : '';
}

}

async function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  if (window.showSaveFilePicker) {
    try {
      const ext = name.split('.').pop();
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext.toUpperCase() + ' file', accept: { [mime]: ['.' + ext] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
      /* fall through to a plain download */
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

async function loadFile(file) {
  if (!file) return;
  let data;
  try {
    const text = await file.text();
    if (/\.html?$/i.test(file.name) || text.trimStart().startsWith('<')) {
      const m = text.match(/<script type="application\/json" id="crd-data">([\s\S]*?)<\/script>/);
      const t = text.match(/<script type="application\/json" id="crd-template">([\s\S]*?)<\/script>/);
      if (m) data = JSON.parse(m[1]);
      else if (t) data = { app: 'code-review-desk-checklist', tpl: JSON.parse(t[1]) };
      else throw new Error('no data');
    } else data = JSON.parse(text);
    if (data.app !== 'code-review-desk' && data.app !== 'code-review-desk-checklist') throw new Error('wrong app');
  } catch {
    toast(`“${file.name}” isn’t a Code Review Desk file.`, true);
    return;
  }
  if (data.app === 'code-review-desk-checklist') return importTpl(data.tpl, file.name);
  openDocData(data);
}
function openDocData(data) {
  doc = migrate(data);
  if (doc.stage === 'submitted' && !doc.review.revId) {
    const r = store.get('rev', {});
    doc.review.revId = r.revId || ''; doc.review.revName = r.revName || '';
  }
  ui.filter = ''; ui.revFilter = 'all'; ui.collapsed = {};
  view = { draft: 'dev', submitted: 'rev', changes: 'dev', approved: 'report' }[doc.stage] || 'dev';
  saveLocal(true);
  render();
  window.scrollTo(0, 0);
  toast(`Opened ${doc.header.ticket || 'review'} — ${STAGES[doc.stage].label}`);
}

/* ============================================================ shared folder
   A Teams channel / SharePoint library synced to this PC by OneDrive. Layout inside the chosen folder:
     checklist.json   the team checklist (published from Checklist setup)
     reviews/*.json   one file per review, updated in place
     archive/*.html   archive copy of every approved review */
const REVIEWS_DIR = 'reviews', ARCHIVE_DIR = 'archive', CHECKLIST_FILE = 'checklist.json';
const idb = {
  db: null,
  open() {
    return this.db ||= new Promise((res, rej) => {
      const r = indexedDB.open('code-review-desk', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); });
    } catch { return undefined; }
  },
  get(k) { return this.run('readonly', st => st.get(k)); },
  set(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },
};
/* status: off | unsupported | needs-permission | missing | connected */
const shared = { handle: null, name: '', status: 'off', reviews: [], scannedAt: '', scanning: false, error: '', tplExists: null, tplMeta: {}, newerTpl: false };
const sharedOn = () => shared.status === 'connected';
const myId = () => String(store.get('whoami') ?? store.get('me', {}).devId ?? store.get('rev', {}).revId ?? '').trim().toUpperCase();
const sameId = (a, b) => !!a && !!b && String(a).trim().toUpperCase() === String(b).trim().toUpperCase();

async function sharedInit() {
  if (!window.showDirectoryPicker) { shared.status = 'unsupported'; return; }
  const h = await idb.get('folder');
  if (!h) return;
  shared.handle = h; shared.name = h.name;
  const perm = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
  if (perm === 'granted') await sharedStart();
  else { shared.status = 'needs-permission'; render(); }
}
async function connectHandle(h) {
  shared.handle = h; shared.name = h.name; scanCache.clear();
  await idb.set('folder', h);
  await sharedStart();
  toast(`Connected to “${h.name}”.`);
}
async function sharedStart() {
  try {
    await shared.handle.getDirectoryHandle(REVIEWS_DIR, { create: true });
    shared.status = 'connected'; shared.error = '';
  } catch (e) {
    shared.status = e.name === 'NotAllowedError' || e.name === 'SecurityError' ? 'needs-permission' : 'missing';
    shared.error = e.message || String(e);
    render(); return;
  }
  render();
  await sharedRefresh(true);
}
async function sharedRefresh(quiet) {
  if (!sharedOn() || shared.scanning) return;
  const before = shared.status;
  shared.scanning = true; paintSharedMeta();
  try {
    await syncSharedTpl(quiet);
    shared.reviews = await scanReviews();
    shared.scannedAt = nowIso(); shared.error = '';
  } catch (e) {
    shared.error = e.message || String(e);
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') shared.status = 'needs-permission';
    else if (e.name === 'NotFoundError') shared.status = 'missing';
  }
  shared.scanning = false;
  if (shared.status !== before) render();
  else { renderTop(); if (view === 'home') paintShared(); }
}
async function syncSharedTpl(quiet) {
  let f;
  try { f = await (await shared.handle.getFileHandle(CHECKLIST_FILE)).getFile(); }
  catch (e) { if (e.name === 'NotFoundError') { shared.tplExists = false; return; } throw e; }
  shared.tplExists = true;
  if (BASE.source === 'shared' && BASE.mod === f.lastModified) return;
  let raw; try { raw = JSON.parse(await f.text()); } catch { return; /* mid-sync */ }
  const tpl = raw.tpl || raw;
  if (!Array.isArray(tpl.sections)) return;
  /* Don't swap the checklist out from under someone with unpublished edits; publishing will warn them instead. */
  if (BASE.source === 'shared' && tplIsCustom()) {
    shared.newerTpl = true;
    const st = $('#tplState'); if (st) st.innerHTML = tplStateHtml();
    return;
  }
  const prev = BASE.source === 'shared' ? BASE.hash : '';
  adoptSharedTpl(tpl, f.lastModified);
  shared.tplMeta = { publishedAt: raw.publishedAt || '', publishedBy: raw.publishedBy || '' };
  shared.newerTpl = false;
  if (prev && prev !== BASE.hash && !quiet) toast('The shared checklist was updated.');
  if (view === 'checklist' && !document.activeElement?.dataset?.t) render();
}
const scanCache = new Map();
function summarize(d, file) {
  return {
    file, id: d.id, ticket: d.header?.ticket || '', title: d.header?.title || '', stage: STAGES[d.stage] ? d.stage : 'draft', round: d.round || 1,
    devId: d.header?.devId || '', devName: d.header?.devName || '', revId: d.review?.revId || '', revName: d.review?.revName || '',
    asgId: d.assignee?.id || '', asgName: d.assignee?.name || '', updatedAt: d.updatedAt || '',
  };
}
async function scanReviews() {
  const dir = await shared.handle.getDirectoryHandle(REVIEWS_DIR, { create: true });
  const found = [];
  for await (const [name, h] of dir.entries()) {
    if (h.kind !== 'file' || !/\.json$/i.test(name) || name.startsWith('~')) continue;
    try {
      const f = await h.getFile();
      let c = scanCache.get(name);
      if (!c || c.mod !== f.lastModified || c.size !== f.size) {
        const d = JSON.parse(await f.text());
        if (d.app !== 'code-review-desk') continue;
        c = { mod: f.lastModified, size: f.size, sum: summarize(d, name) };
        scanCache.set(name, c);
      }
      found.push(c.sum);
    } catch { /* still syncing, or not a review file */ }
  }
  /* OneDrive keeps conflicting edits as extra copies of the same review: show the newest, flag the rest. */
  const byId = new Map();
  for (const x of found) byId.set(x.id, [...(byId.get(x.id) || []), x]);
  return [...byId.values()].map(list => {
    list.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    return { ...list[0], copies: list.slice(1).map(x => x.file) };
  }).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
}
async function readShared(file) {
  const dir = await shared.handle.getDirectoryHandle(REVIEWS_DIR);
  return JSON.parse(await (await (await dir.getFileHandle(file)).getFile()).text());
}
async function writeText(dirName, file, text) {
  const dir = dirName ? await shared.handle.getDirectoryHandle(dirName, { create: true }) : shared.handle;
  const w = await (await dir.getFileHandle(file, { create: true })).createWritable();
  await w.write(text); await w.close();
}
/* Save a review into reviews/. Returns false if the user backs out of a conflict. */
async function writeShared(d) {
  let file = d.shared?.file || `${safeName(d.header.ticket)}_${d.id.slice(-6)}.json`;
  let existing = null;
  try { existing = await readShared(file); } catch (e) { if (e.name !== 'NotFoundError' && !(e instanceof SyntaxError)) throw e; }
  if (existing && existing.id !== d.id) { file = `${safeName(d.header.ticket)}_${d.id}.json`; existing = null; }
  if (existing && existing.updatedAt !== d.shared?.base) {
    const whoSaved = existing.history?.at(-1)?.who || 'Someone';
    const ok = await confirmDlg('Someone else saved this review',
      `The shared copy was changed ${fmtWhen(existing.updatedAt)} (now “${STAGES[existing.stage]?.label || existing.stage}”, last action by ${whoSaved}). Saving replaces their version with yours.`, 'Replace theirs');
    if (!ok) return false;
  }
  d.shared = { file, base: d.updatedAt };
  await writeText(REVIEWS_DIR, file, JSON.stringify(d, null, 1));
  scanCache.delete(file);
  return true;
}
/* Save to the shared folder when connected, otherwise as a file. Returns 'shared' | 'file' | false. */
async function persistReview(d, suffix) {
  if (sharedOn()) {
    try { if (!await writeShared(d)) return false; setTimeout(() => sharedRefresh(true), 50); return 'shared'; }
    catch (e) { toast(`Couldn’t save to the shared folder (${e.message}). Saving a file instead.`, true); delete d.shared; }
  }
  return await download(fileName(d, suffix), JSON.stringify(d, null, 1), 'application/json') ? 'file' : false;
}
async function writeArchive(d) {
  try { const name = fileName(d, 'code-review', 'html'); await writeText(ARCHIVE_DIR, name, standaloneHTML(d)); return name; }
  catch { return ''; }
}

function fld(label, path, o = {}) {
  const v = getPath(doc, path) ?? '';
  const id = 'f_' + path.replace(/\W/g, '_');
  const ph = esc(o.ph || '');
  const ctl = o.area
    ? `<textarea id="${id}" data-b="${path}" rows="${o.rows || 3}" placeholder="${ph}">${esc(v)}</textarea>`
    : `<input id="${id}" data-b="${path}" type="${o.type || 'text'}" value="${esc(v)}" placeholder="${ph}"${o.list ? ` list="${o.list}"` : ''}${o.mono ? ' class="mono"' : ''}${o.type === 'number' ? ' min="0" step="0.25"' : ''}${o.ro ? ' readonly' : ''}>`;
  return `<label class="fld${o.wide ? ' wide' : ''}" for="${id}"><span>${esc(label)}${o.req ? ' <i class="req">*</i>' : ''}</span>${ctl}${o.help ? `<small>${esc(o.help)}</small>` : ''}</label>`;

async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    toast(ok ? msg : 'Copy was blocked by the browser.', !ok);
  }
}
/* Multi-value system field. Stored as a comma-separated string ("DEV.100, QAS.200") so older review files stay compatible. */

    <div class="tags" data-tags="${path}" data-ph="${esc(o.ph || '')}">${tagsHtml(path, vals)}<input class="tag-in mono" data-tagin="${path}" list="dl-sys" autocomplete="off" placeholder="${vals.length ? 'Add another…' : esc(o.ph || '')}" aria-label="${esc(label)}"></div>

function paintTags(path) {
  const box = document.querySelector(`[data-tags="${path}"]`); if (!box) return;
  const vals = splitList(getPath(doc, path));
  $$('.tag', box).forEach(t => t.remove());
  const inp = $('.tag-in', box);
  inp.insertAdjacentHTML('beforebegin', tagsHtml(path, vals));
  inp.placeholder = vals.length ? 'Add another…' : box.dataset.ph;
}
function commitTag(inp) {
  const add = splitList(inp.value); inp.value = '';
  if (!add.length || !doc) return;
  const path = inp.dataset.tagin, cur = splitList(getPath(doc, path));
  for (const v of add) if (!cur.some(c => c.toUpperCase() === v.toUpperCase())) cur.push(v);
  setPath(doc, path, cur.join(', '));
  const hist = [];
  for (const v of [...add, ...store.get('sysHistory', [])]) if (!hist.some(h => h.toUpperCase() === v.toUpperCase())) hist.push(v);
  store.set('sysHistory', hist.slice(0, 30));

function devChecks(d) {
  const sel = selItems(d);
  const noS = sel.filter(([, i]) => !i.dev.s).length;
  const noC = sel.filter(([, i]) => i.dev.s === 'N' && !i.dev.c.trim()).length;
  const list = [
    { ok: !!d.header.ticket.trim(), t: 'Ticket number' },
    { ok: !!d.header.devId.trim(), t: 'Developer SAP ID' },
    { ok: d.objects.some(o => o.name.trim()), t: 'At least one object' },
    { ok: trsOf(d).length > 0, t: 'At least one transport request' },
    { ok: sel.length > 0, t: sel.length ? `${sel.length} checks ticked` : 'Tick the applicable checks' },
    { ok: sel.length > 0 && noS === 0, t: noS ? `${noS} ticked checks need your self-review` : 'Self-review done' },
    { ok: noC === 0, t: noC ? `${noC} “Not followed” need a reason` : 'Exceptions explained' },
  ];
  if (d.stage === 'changes') {
    const open = sel.filter(([, i]) => i.rev.s === 'N' && !i.reply.trim()).length;
    list.push({ ok: open === 0, t: open ? `${open} flagged checks need your response` : 'Reviewer findings answered' });
  }
  return list;
}

function devItem(i) {
  const it = doc.items[i.id];
  const on = !!it?.sel;
  const revNote = on && doc.stage === 'changes' && (it.rev.s || it.rev.c)
    ? `<div class="revnote">Reviewer: ${chip(it.rev.s)} ${esc(it.rev.c)}</div>
       ${it.rev.s === 'N' || it.rev.c ? `<input class="cmt" data-b="items.${i.id}.reply" value="${esc(it.reply)}" placeholder="Your response to the reviewer${it.rev.s === 'N' ? ' (required)' : ''}">` : ''}`
    : '';
  return `<div class="item${on ? ' on' : ''}" data-q="${esc((i.id + ' ' + i.text).toLowerCase())}">
    <label class="item-top"><input type="checkbox" data-a="selItem" data-id="${i.id}" ${on ? 'checked' : ''}><span class="num">${i.n}</span><span class="txt">${esc(i.text)}${it?.by === 'rev' ? ' <span class="badge warn">Added by reviewer</span>' : ''}</span></label>
    ${on ? `<div class="item-x">${seg('devS', i.id, it.dev.s)}
      <input class="cmt" data-b="items.${i.id}.dev.c" value="${esc(it.dev.c)}" placeholder="${it.dev.s === 'N' ? 'Why not followed? (required)' : 'Developer comment (optional)'}">
      ${revNote}</div>` : ''}
  </div>`;
}

function devRail() {
  const d = doc, checks = devChecks(d), ready = checks.every(c => c.ok);
  const secs = selectedSections(d);
  return `<div class="card">
      <h4>Checklist summary</h4>
      ${secs.length ? `<ul class="secsum">${secs.map(s => `<li><span>${esc(s.title)}</span><b>${s.items.length}</b></li>`).join('')}</ul>` : '<p class="muted small" style="margin:0">No checks ticked yet.</p>'}
    </div>
    <div class="card">
      <h4>Ready to send?</h4>
      ${readyList(checks)}
      <div class="stack">
        <button class="btn primary block" data-a="submit" ${ready ? '' : 'disabled'}>${d.stage === 'changes' ? `Resubmit (round ${d.round + 1})` : 'Save file for reviewer'}</button>
        <button class="btn block" data-a="saveDraft">Save draft file</button>
        <button class="btn ghost block" data-a="tab" data-v="report">Preview document</button>
      </div>
      <p class="faint small" style="margin:10px 0 0">Your work is also kept in this browser as you type.</p>
    </div>`;
}

/* ============================================================ reviewer view */
function revChecks(d) {
  const sel = selItems(d);
  const pending = sel.filter(([, i]) => !i.rev.s).length;
  const noC = sel.filter(([, i]) => i.rev.s === 'N' && !i.rev.c.trim()).length;
  const list = [
    { ok: !!d.review.revId.trim(), t: 'Reviewer SAP ID' },
    { ok: !!d.review.date, t: 'Review date' },
    { ok: String(d.review.effort).trim() !== '', t: 'Review effort (person hours)' },
    { ok: sel.length > 0 && pending === 0, t: pending ? `${pending} checks still to review` : 'Every check reviewed' },
    ...(trsOf(d).length ? [{ ok: trsOf(d).every(t => t.checked), t: trsOf(d).some(t => !t.checked) ? `${trsOf(d).filter(t => !t.checked).length} transports not checked yet` : 'Every transport checked' }] : []),
    { ok: noC === 0, t: noC ? `${noC} “Not followed” need a comment` : 'Findings explained' },
    { ok: !!d.review.verdict, t: 'Verdict' },
  ];
  if (d.review.revId.trim() && d.review.revId.trim() === d.header.devId.trim()) list.push({ ok: false, soft: true, t: 'Reviewer ID is the same as the developer’s' });
  return list;
}

function renderRev() {
  const d = doc, h = d.header;
  const tampered = d.seals.dev && devSealOf(d) !== d.seals.dev;
  const lastRound = d.pastRounds.at(-1);
  const secs = selectedSections(d);
  const show = it => ui.revFilter === 'all' || (ui.revFilter === 'pending' && !it.rev.s) || (ui.revFilter === 'issues' && (it.rev.s === 'N' || it.dev.s === 'N'));
  const trs = trsOf(d);
  const nChecked = trs.filter(t => t.checked).length;

  return `<div class="layout"><div class="col">
    ${tampered ? `<div class="banner bad"><span class="bi">⚠</span><div><b>This file was changed after the developer sent it</b>The developer’s section no longer matches the fingerprint taken when it was submitted. Confirm with ${esc(devWho(d))} that you have the right file.</div></div>` : ''}
    ${d.round > 1 ? `<div class="banner info"><span class="bi">↻</span><div><b>Round ${d.round}</b>You requested changes in round ${lastRound?.round}. Previously flagged checks are reset for you to re-check; the developer’s responses are shown under each one.</div></div>` : ''}
    <section class="card"><h2><span class="step">1</span>Change under review</h2>
      <dl class="kv">
        <div><dt>Ticket</dt><dd class="mono">${esc(h.ticket)}</dd></div>
        <div><dt>Module</dt><dd>${esc(h.module) || '—'}</dd></div>
        <div><dt>Developer</dt><dd>${esc(devWho(d))}</dd></div>
        <div><dt>Creation date</dt><dd>${fmtDate(h.created) || '—'}</dd></div>
        ${d.assignee.id || d.assignee.name ? `<div><dt>Assigned reviewer</dt><dd>${esc(who(d.assignee.id, d.assignee.name))}</dd></div>` : ''}
        <div><dt>System/Client — development</dt><dd class="mono">${splitList(h.devSystem).map(esc).join(', ') || '—'}</dd></div>
        <div><dt>Systems/Clients — import</dt><dd class="mono">${splitList(h.importSystem).map(esc).join(', ') || '—'}</dd></div>
      </dl>
      ${h.title || h.summary ? `<div class="summary">${h.title ? `<b>${esc(h.title)}</b>${h.summary ? '\n' : ''}` : ''}${esc(h.summary)}</div>` : ''}
      <div class="tbl-wrap"><table class="ro"><thead><tr><th>Object</th><th>Type</th><th>Note</th></tr></thead><tbody>
        ${d.objects.filter(o => o.name).map(o => `<tr><td class="mono">${esc(o.name)}</td><td>${esc(typeLabelOf(o))}</td><td>${esc(o.note)}</td></tr>`).join('')}
      </tbody></table></div>
      ${d.backupOn && d.backup.length ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Version backup (${d.backup.length})</summary>
        <div class="tbl-wrap"><table class="ro"><thead><tr><th>Object</th><th>System</th><th>Dev</th><th>PreProd</th><th>Prod</th></tr></thead><tbody>
        ${d.backup.map(b => `<tr><td class="mono">${esc(b.object)}</td><td>${esc(b.system)}</td><td class="mono">${esc(b.dev)}</td><td class="mono">${esc(b.preprod)}</td><td class="mono">${esc(b.prod)}</td></tr>`).join('')}
        </tbody></table></div></details>` : ''}
    </section>

    <section class="card"><h2><span class="step">2</span>Transport requests<span class="aside" id="trCount">${nChecked} / ${trs.length} checked</span></h2>
      ${trs.length ? `<div class="tools"><button class="btn sm" data-a="copyTrs">Copy all TR numbers</button><span class="faint small">Tick each transport once you have checked it.</span></div>
      <div class="trlist">${trs.map(t => { const i = d.transports.indexOf(t); return `<div class="tritem${t.checked ? ' done' : ''}">
        <label class="trchk" title="Mark as checked"><input type="checkbox" data-a="trCheck" data-i="${i}" ${t.checked ? 'checked' : ''}></label>
        <div class="trmain">
          <div class="trhead"><span class="mono trno">${esc(t.tr)}</span><button class="btn sm ghost" data-a="copyTr" data-i="${i}" title="Copy ${esc(t.tr)}">Copy</button><span class="muted small mono">${esc(t.system) || '—'}</span></div>
          ${t.note ? `<p class="cm">${esc(t.note)}</p>` : ''}
          <input class="cmt" data-b="transports.${i}.revNote" value="${esc(t.revNote)}" placeholder="Reviewer note (optional)">
        </div>
      </div>`; }).join('')}</div>` : '<p class="muted">The developer listed no transport requests.</p>'}
    </section>

    <section class="card"><h2><span class="step">3</span>Reviewer details</h2>
      <div class="grid">
        ${fld('Check performed by (SAP ID)', 'review.revId', { req: true, mono: true })}
        ${fld('Reviewer name', 'review.revName')}
        ${fld('Review date', 'review.date', { type: 'date', req: true })}
        ${fld('Review effort (person hours)', 'review.effort', { type: 'number', req: true, ph: 'e.g. 1.5' })}
      </div>
    </section>

    <section class="card"><h2><span class="step">4</span>Checks</h2>
      <div class="tools">
        <div class="filters">${[['all', 'All'], ['pending', 'To review'], ['issues', 'Not followed']].map(([k, l]) => `<button data-a="revFilter" data-v="${k}" aria-pressed="${ui.revFilter === k}">${l}</button>`).join('')}</div>
        <span class="sp"></span>
        <button class="btn sm" data-a="addMissed">＋ Add a check the developer missed</button>
      </div>
      ${secs.map(s => {
        const items = s.items.filter(i => show(d.items[i.id]));
        if (!items.length) return '';
        return `<div class="sec"><div class="sec-h" style="cursor:default"><h3>${esc(s.title)}</h3><span class="cnt">${s.items.filter(i => d.items[i.id].rev.s).length} / ${s.items.length} reviewed</span></div>
          <div class="sec-b">${items.map(i => revItem(i)).join('')}</div></div>`;
      }).join('') || '<p class="muted">Nothing matches this filter.</p>'}
    </section>

    <section class="card"><h2><span class="step">5</span>Verdict</h2>
      <div class="verdict">
        <button class="vbtn ok" data-a="verdict" data-v="approve" aria-pressed="${d.review.verdict === 'approve'}">✔ Approve<small>Meets the checklist. Ready to archive.</small></button>
        <button class="vbtn bad" data-a="verdict" data-v="changes" aria-pressed="${d.review.verdict === 'changes'}">↺ Request changes<small>The file goes back to the developer for another round.</small></button>
      </div>
      ${fld('Overall comment', 'review.comment', { area: true, wide: true, rows: 3, ph: 'Summary for the developer and the archive.' })}
    </section>
  </div>
  <aside class="rail" id="rail">${revRail()}</aside></div>`;
}

function revItem(i) {
  const d = doc, it = d.items[i.id];
  const lr = d.pastRounds.at(-1);
  const prev = lr?.items?.[i.id];
  return `<div class="item rv st-${it.rev.s || 'none'}">
    <div class="item-top"><span class="num">${i.n}</span><span class="txt">${esc(i.text)}</span>
      ${it.by === 'rev' ? `<span class="badge warn">Added by reviewer</span>${isThisRoundRevAdd(d, it) ? `<button class="icon" data-a="unMissed" data-id="${i.id}" title="Remove this added check">✕</button>` : ''}` : ''}</div>
    <div class="rv-grid">
      <div class="rv-col"><div class="lbl">Developer</div>${chip(it.dev.s)}${it.dev.c ? `<p class="cm">${esc(it.dev.c)}</p>` : ''}
        ${prev && (prev.s === 'N' || prev.c || prev.reply) ? `<div class="prev">Round ${lr.round} review: ${chip(prev.s)} ${esc(prev.c)}${prev.reply ? `<br>Developer response: ${esc(prev.reply)}` : ''}</div>` : ''}
      </div>
      <div class="rv-col"><div class="lbl">Reviewer check</div>${seg('revS', i.id, it.rev.s)}
        <input class="cmt" data-b="items.${i.id}.rev.c" value="${esc(it.rev.c)}" placeholder="${it.rev.s === 'N' ? 'What needs fixing? (required)' : 'Reviewer comment (optional)'}">
      </div>
    </div>
  </div>`;
}

function revRail() {
  const d = doc, sel = selItems(d).map(([, i]) => i);
  const done = sel.filter(i => i.rev.s).length;
  const n = k => sel.filter(i => i.rev.s === k).length;
  const checks = revChecks(d), ready = checks.filter(c => !c.soft).every(c => c.ok);
  return `<div class="card">
      <h4>Progress</h4>
      <div class="small"><b>${done}</b> of ${sel.length} checks reviewed</div>
      <div class="bar"><i style="width:${sel.length ? Math.round(done / sel.length * 100) : 0}%"></i></div>
      <div class="stats"><span class="chip ok">${n('F')} followed</span><span class="chip bad">${n('N')} not followed</span><span class="chip na">${n('NA')} N/A</span></div>
    </div>
    <div class="card">
      <h4>Ready to finish?</h4>
      ${readyList(checks)}
      <div class="stack">
        <button class="btn primary block" data-a="finish" ${ready ? '' : 'disabled'}>Finish review</button>
        <button class="btn block" data-a="saveProgress">Save progress file</button>
        <button class="btn ghost block" data-a="tab" data-v="report">Preview document</button>
      </div>
    </div>`;
}

  const st = s => s ? `<span class="st ${s}">${STATUS[s].mark} ${STATUS[s].code}</span>` : '<span class="st">—</span>';
  const objs = d.objects.filter(o => o.name);

  const devSealState = !d.seals.dev ? 'not sealed yet' : d.stage === 'changes' ? `${d.seals.dev} (awaiting resubmission)` : devSealOf(d) === d.seals.dev ? `${d.seals.dev} ✔ intact` : `${d.seals.dev} ⚠ MODIFIED after submission`;
  const revSealState = !d.seals.rev ? 'not sealed yet' : revSealOf(d) === d.seals.rev ? `${d.seals.rev} ✔ intact` : `${d.seals.rev} ⚠ MODIFIED after review`;

  return `<div class="rp">
  <h1>${esc(d.template.name)}<span class="stamp ${d.stage}">${STAGES[d.stage].stamp}</span></h1>
  <p class="sub"><b>${esc(h.ticket)}</b>${h.title ? ' — ' + esc(h.title) : ''}</p>
  <table class="kv" border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;width:100%">
    <tr><th>Module</th><td>${esc(h.module)}</td><th>Check performed by (SAP ID)</th><td>${esc(who(r.revId, r.revName))}</td></tr>
    <tr><th>Ticket no</th><td class="mono">${esc(h.ticket)}</td><th>Review date</th><td>${fmtDate(r.date)}</td></tr>

    <tr><th>Developer SAP ID</th><td>${esc(who(h.devId, h.devName))}</td><th>Verdict</th><td><b>${verdict}</b></td></tr>

    <tr><th>Systems/Client where import is required</th><td class="mono">${splitList(h.importSystem).map(esc).join('<br>')}</td></tr>

  ${trs.length ? `<h3>Transport requests</h3>${tbl(['Transport request', 'Source system/client', 'Developer note', 'Reviewer checked', 'Reviewer note'], trs.map(t => `<tr><td class="mono">${esc(t.tr)}</td><td class="mono">${esc(t.system)}</td><td class="pre">${esc(t.note)}</td><td><span class="st ${t.checked ? 'F' : ''}">${t.checked ? '✔ Checked' : '—'}</span></td><td class="pre">${esc(t.revNote)}</td></tr>`))}` : ''}
  ${objs.some(o => o.type || o.note) ? `<h3>Objects</h3>${tbl(['Object', 'Type', 'Note'], objs.map(o => `<tr><td class="mono">${esc(o.name)}</td><td>${esc(typeLabelOf(o))}</td><td>${esc(o.note)}</td></tr>`))}` : ''}

  <h3>QA checks</h3>
  <table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;width:100%">
    <tr><th class="num">#</th><th style="width:36%">QA check</th><th>Developer review</th><th style="width:17%">Developer comments</th><th>Reviewer check</th><th style="width:17%">Reviewer comments</th></tr>
    ${secs.map(s => `<tr class="sec"><td colspan="6"><b>${esc(s.title)}</b></td></tr>` + s.items.map(i => {
      const it = d.items[i.id];
      return `<tr><td class="num">${i.n}</td><td>${esc(i.text)}${it.by === 'rev' ? ' <span class="tag">[added by reviewer]</span>' : ''}</td>

  ${d.pastRounds.length ? `<h3>Earlier review rounds</h3>${tbl(['Round', 'Reviewer', 'Date', 'Effort (h)', 'Findings', 'Comment'], d.pastRounds.map(p => {

      <td>${flagged.length ? flagged.map(([id, x]) => `<b>${esc(id)}</b>: ${esc(x.c)}${x.reply ? ` <i>→ ${esc(x.reply)}</i>` : ''}`).join('<br>') : '—'}</td><td class="pre">${esc(p.review?.comment)}</td></tr>`;
  }))}` : ''}

  ${d.history.length ? `<h3>History</h3>${tbl(['When', 'Who', 'Action', 'Note'], d.history.map(x => `<tr><td style="white-space:nowrap">${fmtWhen(x.at)}</td><td>${esc(x.who)}</td><td>${esc(x.action)}</td><td class="pre">${esc(x.note)}</td></tr>`))}` : ''}

  <div class="foot">Generated by Code Review Desk · checklist “${esc(d.template.name)}” v${esc(d.template.version)} · developer fingerprint ${devSealState} · review fingerprint ${revSealState}</div>
  </div>`;
}

function wikiMarkup(d) {
  const h = d.header, r = d.review;
  const w = s => String(s ?? '').replace(/\r?\n/g, ' ').replace(/\|/g, '/').replace(/([{}[\]])/g, '\\$1').trim() || ' ';
  const st = s => s ? `${STATUS[s].wiki} ${STATUS[s].code}` : ' ';
  const out = [];
  out.push(`h1. Code review — ${w(h.ticket)}${h.title ? ' — ' + w(h.title) : ''}`);
  out.push(`*Status:* ${STAGES[d.stage].label} · *Round:* ${d.round} · *Checklist:* ${w(d.template.name)} v${w(d.template.version)}`, '');
  out.push(`||Module|${w(h.module)}||Check performed by (SAP ID)|${w(who(r.revId, r.revName))}|`);
  out.push(`||Ticket no|${w(h.ticket)}||Review date|${w(fmtDate(r.date))}|`);
  out.push(`||Object name(s)|${w(d.objects.filter(o => o.name).map(o => o.name).join(', '))}||Review effort (person hours)|${w(totalEffort(d))}|`);
  out.push(`||Developer SAP ID|${w(who(h.devId, h.devName))}||Verdict|${d.stage === 'approved' ? '(/) Approved' : d.stage === 'changes' ? '(x) Changes requested' : ' '}|`);
  out.push(`||Creation date|${w(fmtDate(h.created))}||Transport requests|${w(trsOf(d).map(t => t.tr).join(', '))}|`);
  out.push(`||System/Client (development)|${w(splitList(h.devSystem).join(', '))}||Systems/Clients (import)|${w(splitList(h.importSystem).join(', '))}|`, '');
  if (h.summary) out.push('h2. Change description', w(h.summary), '');
  if (trsOf(d).length) {
    out.push('h2. Transport requests', '||Transport request||Source system/client||Developer note||Reviewer checked||Reviewer note||');
    trsOf(d).forEach(t => out.push(`|${w(t.tr)}|${w(t.system)}|${w(t.note)}|${t.checked ? '(/) Checked' : ' '}|${w(t.revNote)}|`));
    out.push('');
  }
  out.push('h2. QA checks', '||#||QA check||Developer review||Developer comments||Reviewer check||Reviewer comments||');
  for (const s of selectedSections(d)) {
    out.push(`|*${w(s.title)}*| | | | | |`);
    for (const i of s.items) {
      const it = d.items[i.id];
      out.push(`|${i.n}|${w(i.text)}${it.by === 'rev' ? ' _(added by reviewer)_' : ''}|${st(it.dev.s)}|${w([it.dev.c, it.reply && 'Response: ' + it.reply].filter(Boolean).join(' — '))}|${st(it.rev.s)}|${w(it.rev.c)}|`);
    }
  }
  if (r.comment) out.push('', 'h2. Reviewer’s overall comment', w(r.comment));
  if (d.backupOn && d.backup.length) {
    out.push('', 'h2. Version backup', '||Object||System||Dev||PreProd||Prod||');
    d.backup.forEach(b => out.push(`|${w(b.object)}|${w(b.system)}|${w(b.dev)}|${w(b.preprod)}|${w(b.prod)}|`));
  }
  if (d.history.length) {
    out.push('', 'h2. History', '||When||Who||Action||Note||');
    d.history.forEach(x => out.push(`|${w(fmtWhen(x.at))}|${w(x.who)}|${w(x.action)}|${w(x.note)}|`));
  }
  return out.join('\n');
}

function refreshRail() {

function applyFilter() {
  const box = $('#checks'); if (!box) return;
