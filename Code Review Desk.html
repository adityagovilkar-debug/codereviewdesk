      <p class="muted">Checks you add are marked “added by reviewer”. Review them like any other; if you request changes, the developer will self-review them too.</p>
      <input type="search" placeholder="Filter…" oninput="const q=this.value.toLowerCase();document.querySelectorAll('#dlg .pick').forEach(p=>p.hidden=!p.textContent.toLowerCase().includes(q))">
      <div class="dlg-list">${secs.map(s => `<h4>${esc(s.title)}</h4>${s.items.map(i => `<label class="pick"><input type="checkbox" value="${i.id}"><span class="num">${i.n}</span><span>${esc(i.text)}</span></label>`).join('')}`).join('') || '<p>Every check is already included.</p>'}</div>
      <div class="dlg-act"><button class="btn" data-a="closeDlg">Cancel</button><button class="btn primary" data-a="confirmMissed">Add selected</button></div>`);
  },
  confirmMissed() {
    const ids = $$('#dlg .pick input:checked').map(x => x.value);
    ids.forEach(id => { doc.items[id] = { sel: true, by: 'rev', addedRound: doc.round, dev: { s: '', c: '' }, rev: { s: '', c: '' }, reply: '' }; });
    snapshot(doc); closeDlg(); touched(); render();
    if (ids.length) toast(`Added ${ids.length} check${ids.length > 1 ? 's' : ''}.`);
  },
  unMissed(el) { delete doc.items[el.dataset.id]; snapshot(doc); touched(); render(); },
  closeDlg() { closeDlg(); },
  addTr() {
    doc.transports.push({ ...newTr(), system: doc.transports.at(-1)?.system || '' });
    touched(); render(); $(`[data-trin="${doc.transports.length - 1}"]`)?.focus();
  },
  delTr(el) { doc.transports.splice(+el.dataset.i, 1); touched(); render(); },
  trCheck(el) {
    doc.transports[+el.dataset.i].checked = el.checked;
    el.closest('.tritem').classList.toggle('done', el.checked);
    const trs = trsOf(doc); $('#trCount').textContent = `${trs.filter(t => t.checked).length} / ${trs.length} checked`;
    touched();
  },
  copyTr(el) { const t = doc.transports[+el.dataset.i].tr; copyText(t, 'Copied ' + t); },
  copyTrs() { copyText(trsOf(doc).map(t => t.tr).join('\n'), `Copied ${trsOf(doc).length} TR numbers`); },
  tagDel(el) {
    const path = el.dataset.p, vals = splitList(getPath(doc, path));
    vals.splice(+el.dataset.i, 1); setPath(doc, path, vals.join(', '));
    paintTags(path); touched(); document.querySelector(`[data-tagin="${path}"]`)?.focus();
  },

  setup() { view = 'checklist'; render(); window.scrollTo(0, 0); },
  tplToggle(el, e) {
    if (e.target.closest('input')) return;
    const sec = el.closest('.sec'); const c = !sec.classList.contains('closed');
    sec.classList.toggle('closed', c); ui.tplCollapsed[el.dataset.s] = c;
    if (!c) $$('.titem textarea', sec).forEach(autoGrow);
  },
  tplExpand(el) { TPL.sections.forEach(s => ui.tplCollapsed[s.id] = el.dataset.v === '1'); render(); },
  tplAddType() {
    TPL.objectTypes.push({ id: 'T' + uid().slice(-7).toUpperCase(), label: '', secs: [] });
    tplChanged(); $$('.trow input').at(-1)?.focus();
  },
  tplTypeMove(el) { if (moveIn(TPL.objectTypes, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplTypeDel(el) {
    const o = TPL.objectTypes[+el.dataset.i];
    if (o.label.trim() && !await confirmDlg('Delete object type?', `“${o.label}” will no longer be offered. Reviews that already use it keep its name.`, 'Delete')) return;
    TPL.objectTypes.splice(+el.dataset.i, 1); tplChanged();
  },
  tplTypeSec(el) {
    const o = TPL.objectTypes[+el.dataset.i], id = el.dataset.s;
    o.secs = o.secs.includes(id) ? o.secs.filter(x => x !== id) : TPL.sections.map(s => s.id).filter(x => x === id || o.secs.includes(x));
    saveTpl(); el.setAttribute('aria-pressed', o.secs.includes(id));
  },
  tplAddSec() {
    openDlg(`<h2>New section</h2>
      <label class="fld"><span>Section name</span><input id="newSecName" placeholder="e.g. Workflow / BRF+"></label>
      <div class="dlg-act"><button class="btn" data-a="closeDlg">Cancel</button><button class="btn primary" data-a="tplAddSecGo">Add section</button></div>`);
    const inp = $('#newSecName'); inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') A.tplAddSecGo(); });
  },
  tplAddSecGo() {
    const title = ($('#newSecName')?.value || '').trim();
    if (!title) return $('#newSecName')?.focus();
    const id = newSectionId(title);
    TPL.sections.push({ id, title, next: 2, items: [{ id: `${id}-01`, text: '' }] });
    ui.tplCollapsed[id] = false; closeDlg(); tplChanged();
    $$('.sec').at(-1)?.querySelector('textarea')?.focus();
  },
  tplSecMove(el) { if (moveIn(TPL.sections, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplSecDel(el) {
    const s = TPL.sections[+el.dataset.i];
    if (!await confirmDlg('Delete section?', `“${s.title || 'Untitled section'}” and its ${s.items.length} checks will be removed from the checklist. Reviews already sent are not affected.`, 'Delete section')) return;
    TPL.sections.splice(+el.dataset.i, 1);
    TPL.objectTypes.forEach(o => o.secs = o.secs.filter(x => x !== s.id));
    tplChanged();
  },
  tplAddItem(el) {
    const si = +el.dataset.i, s = TPL.sections[si];
    s.items.push({ id: `${s.id}-${String(s.next).padStart(2, '0')}`, text: '' });
    s.next++; ui.tplCollapsed[s.id] = false; tplChanged();
    $(`[data-t="sections.${si}.items.${s.items.length - 1}.text"]`)?.focus();
  },
  tplItemMove(el) { if (moveIn(TPL.sections[+el.dataset.si].items, +el.dataset.i, +el.dataset.d)) tplChanged(); },
  async tplItemDel(el) {
    const items = TPL.sections[+el.dataset.si].items, it = items[+el.dataset.i];
    if (it.text.trim() && !await confirmDlg('Delete check?', `“${it.text.slice(0, 140)}${it.text.length > 140 ? '…' : ''}”`, 'Delete')) return;
    items.splice(+el.dataset.i, 1); tplChanged();
  },
  async tplExport() {
    const body = JSON.stringify({ app: 'code-review-desk-checklist', schema: 1, exportedAt: nowIso(), tpl: TPL }, null, 1);
    if (await download(`checklist_${safeName(TPL.name)}_v${safeName(TPL.version)}.json`, body, 'application/json')) toast('Checklist exported.');
  },
  async tplBake() {
    if (await download('Code Review Desk.html', bakedHTML(), 'text/html')) toast('Saved — share this copy of the tool with your team.');
  },
  async tplReset() {
    const sharedBase = BASE.source === 'shared';
    if (!await confirmDlg(sharedBase ? 'Discard unpublished changes?' : 'Reset to the built-in checklist?', 'Your changes in this browser will be discarded. Export the checklist first if you want to keep them.', sharedBase ? 'Discard' : 'Reset')) return;
    store.del('template');
    if (sharedBase && shared.newerTpl) { BASE.mod = 0; shared.newerTpl = false; TPL = structuredClone(BASE.tpl); await syncSharedTpl(true); }
    else TPL = structuredClone(BASE.tpl);
    render(); toast(sharedBase ? 'Showing the shared checklist.' : 'Back to the built-in checklist.');
  },
  dlgYes() { const r = dlgResolve; dlgResolve = null; closeDlg(); r?.(true); },
  dlgNo() { const r = dlgResolve; dlgResolve = null; closeDlg(); r?.(false); },

  async saveDraft() {
    const d = structuredClone(doc); if (d.stage !== 'changes') d.stage = d.stage === 'submitted' ? 'submitted' : 'draft';
    snapshot(d); stampTypeLabels(d); tidyTransports(d); d.template = { name: TPL.name, version: TPL.version };
    const how = await persistReview(d, d.stage === 'changes' ? 'in-rework' : 'draft');
    if (how) {
      doc.checklist = d.checklist; doc.shared = d.shared; rememberDev(); saveLocal(true);
      toast(how === 'shared' ? `Draft saved to ${shared.name}.` : 'Draft saved.');
    }
  },
  async submit() {
    if (!devChecks(doc).every(c => c.ok)) return toast('Finish the list on the right first.', true);
    const d = structuredClone(doc), at = nowIso(), resub = d.stage === 'changes';
    if (resub) {
      d.pastRounds.push({
        round: d.round, review: structuredClone(d.review),
        items: Object.fromEntries(selItems(d).filter(([, i]) => i.rev.s || i.rev.c).map(([id, i]) => [id, { s: i.rev.s, c: i.rev.c, reply: i.reply }])),
      });
      for (const i of Object.values(d.items)) { if (i.rev.s === 'N') i.rev = { s: '', c: '' }; i.reply = ''; }
      d.review = { revId: d.review.revId, revName: d.review.revName, date: '', effort: '', verdict: '', comment: '' };
      d.round++; d.seals.rev = '';
    }
    d.stage = 'submitted'; d.updatedAt = at;
    stampTypeLabels(d); tidyTransports(d); d.template = { name: TPL.name, version: TPL.version };
    snapshot(d);
    d.history.push({ at, who: devWho(d), role: 'Developer', action: resub ? `Resubmitted — round ${d.round}` : 'Submitted for review', note: '' });
    d.seals.dev = devSealOf(d);
    const name = fileName(d, 'for-review');
    const how = await persistReview(d, 'for-review');
    if (!how) return;
    doc = d; rememberDev(); saveLocal(true); render();
    const reviewer = who(d.assignee.id, d.assignee.name);
    openDlg(how === 'shared'
      ? `<h2>Sent for review</h2>
        <p>Saved to <b>${esc(shared.name)}</b> › reviews › <code>${esc(d.shared.file)}</code>. It shows up under <b>Needs my review</b> for ${reviewer ? esc(reviewer) : 'reviewers'} once OneDrive has synced.</p>
        ${teamsMsgHtml(`Code review ready: ${d.header.ticket}${d.header.title ? ' — ' + d.header.title : ''}${d.round > 1 ? ` (round ${d.round})` : ''}. It's in Code Review Desk under "Needs my review".`)}
        <div class="dlg-act"><button class="btn" data-a="copyMsg">Copy message</button><button class="btn primary" data-a="closeDlg">Done</button></div>`
      : `<h2>Saved for review</h2>
      <p>Send <code>${esc(name)}</code> to your reviewer (Teams, email, shared drive).</p>
      <p class="muted">They open <b>Code Review Desk.html</b>, click <b>Open review file</b> and pick it. If they request changes you’ll get a file back — open it the same way.</p>
      <div class="dlg-act"><button class="btn primary" data-a="closeDlg">Done</button></div>`);
  },
  async saveProgress() {
    const d = structuredClone(doc);
    const how = await persistReview(d, 'review-in-progress');
    if (how) { doc.shared = d.shared; rememberRev(); saveLocal(true); toast(how === 'shared' ? `Progress saved to ${shared.name}.` : 'Progress saved.'); }
  },
  async finish() {
    if (!revChecks(doc).filter(c => !c.soft).every(c => c.ok)) return toast('Finish the list on the right first.', true);
    const nN = selItems(doc).filter(([, i]) => i.rev.s === 'N').length;
    if (doc.review.verdict === 'approve' && nN && !await confirmDlg('Approve with findings?', `${nN} check${nN > 1 ? 's are' : ' is'} marked Not followed. Approve anyway?`, 'Approve anyway')) return;
    const d = structuredClone(doc), at = nowIso();
    d.stage = d.review.verdict === 'approve' ? 'approved' : 'changes'; d.updatedAt = at;
    snapshot(d);
    d.history.push({ at, who: revWho(d), role: 'Reviewer', action: d.stage === 'approved' ? `Approved — round ${d.round}` : `Changes requested — round ${d.round}`, note: d.review.comment });
    d.seals.rev = revSealOf(d);
    const name = fileName(d, d.stage === 'approved' ? 'approved' : 'changes-requested');
    const how = await persistReview(d, d.stage === 'approved' ? 'approved' : 'changes-requested');
    if (!how) return;
    const archived = how === 'shared' && d.stage === 'approved' ? await writeArchive(d) : '';
    doc = d; rememberRev(); saveLocal(true); view = 'report'; render(); window.scrollTo(0, 0);
    const title = `${d.header.ticket}${d.header.title ? ' — ' + d.header.title : ''}`;
    const nFind = selItems(d).filter(([, i]) => i.rev.s === 'N').length;
    if (how === 'shared') return openDlg(d.stage === 'approved'
      ? `<h2>Review approved</h2><p>Saved to <b>${esc(shared.name)}</b>.${archived ? ` Archive copy: <b>archive</b> › <code>${esc(archived)}</code> — attach it on Confluence.` : ''}</p>
        ${teamsMsgHtml(`Code review approved: ${title} (round ${d.round}).${archived ? ` Archive: ${shared.name}/archive/${archived}` : ''}`)}
        <div class="dlg-act"><button class="btn" data-a="copyMsg">Copy message</button><button class="btn primary" data-a="closeDlg">Done</button></div>`
      : `<h2>Changes requested</h2><p>Saved to <b>${esc(shared.name)}</b>. It shows up for ${esc(devWho(d))} under <b>Changes requested on my work</b>.</p>
        ${teamsMsgHtml(`Changes requested on ${title} (round ${d.round}): ${nFind} finding${nFind === 1 ? '' : 's'}. It's in Code Review Desk under "Changes requested on my work".`)}
        <div class="dlg-act"><button class="btn" data-a="copyMsg">Copy message</button><button class="btn primary" data-a="closeDlg">Done</button></div>`);
    openDlg(d.stage === 'approved'
      ? `<h2>Review approved</h2><p>Saved <code>${esc(name)}</code>. Send it back to ${esc(devWho(d))}.</p><p class="muted">Whoever archives it can use <b>Copy for Confluence</b> and <b>Download archive .html</b> on this page.</p><div class="dlg-act"><button class="btn primary" data-a="closeDlg">Done</button></div>`
      : `<h2>Changes requested</h2><p>Saved <code>${esc(name)}</code>. Send it back to ${esc(devWho(d))}. They open it, fix the flagged checks and resubmit.</p><div class="dlg-act"><button class="btn primary" data-a="closeDlg">Done</button></div>`);
  },

  print() { window.print(); },
  async copyRich() {
    const html = `<style>${REPORT_CSS}</style>` + reportHTML(doc);
    const paper = $('#paper');
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([paper.innerText], { type: 'text/plain' }),
      })]);
      toast('Copied — paste into the Confluence page.');
    } catch {
      const range = document.createRange(); range.selectNodeContents(paper);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      const ok = document.execCommand('copy'); sel.removeAllRanges();
      toast(ok ? 'Copied — paste into the Confluence page.' : 'Copy was blocked — select the document and press Ctrl+C.', !ok);
    }
  },
  async copyWiki() {
    const text = wikiMarkup(doc);
    try { await navigator.clipboard.writeText(text); toast('Wiki markup copied — in Confluence use Insert › Markup.'); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      toast(ok ? 'Wiki markup copied.' : 'Copy was blocked by the browser.', !ok);
    }
  },
  async dlHtml() { if (await download(fileName(doc, doc.stage === 'approved' ? 'code-review' : STAGES[doc.stage].stamp.toLowerCase().replace(/\s+/g, '-'), 'html'), standaloneHTML(doc), 'text/html')) toast('Archive saved.'); },
  async dlJson() { if (await download(fileName(doc, doc.stage === 'approved' ? 'approved' : doc.stage), JSON.stringify(doc, null, 1), 'application/json')) toast('Saved.'); },
};

/* ============================================================ wiring */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) { ui.filter = el.value; applyFilter(); return; }
  if (el.dataset.sq) { ui.sharedQ = el.value; paintShared(); return; }
  if (el.dataset.me) { store.set('whoami', el.value.trim().toUpperCase()); paintShared(); renderTop(); return; }
  if (el.dataset.t) { if (el.dataset.t === '__systems') TPL.systems = el.value.split(',').map(x => x.trim()).filter(Boolean); else setPath(TPL, el.dataset.t, el.value); saveTpl(); if (el.tagName === 'TEXTAREA') autoGrow(el); return; }
  const p = el.dataset.b;
  if (!p || !doc) return;
  setPath(doc, p, el.value);
  touched();
  if (el.dataset.rr) render();
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest?.('[data-tagin]'); if (!inp) return;
  if (e.key === 'Enter' || e.key === ',' || e.key === ';') { e.preventDefault(); commitTag(inp); }
  else if (e.key === 'Backspace' && !inp.value) {
    const path = inp.dataset.tagin, vals = splitList(getPath(doc, path));
    if (vals.length) { vals.pop(); setPath(doc, path, vals.join(', ')); paintTags(path); touched(); }
  }
});
document.addEventListener('focusin', e => {
  if (!e.target.dataset?.trsys || !doc) return;
  const opts = [...new Set([...splitList(doc.header.devSystem), ...store.get('sysHistory', [])])];
  $('#dl-src').innerHTML = opts.map(x => `<option value="${esc(x)}">`).join('');
});
document.addEventListener('paste', e => {
  const inp = e.target.closest?.('[data-trin]'); if (!inp || !doc) return;
  const list = splitList(e.clipboardData?.getData('text') || '');
  if (list.length < 2) return;
  e.preventDefault();
  const i = +inp.dataset.trin, sys = doc.transports[i].system;
  doc.transports[i].tr = list[0];
  doc.transports.splice(i + 1, 0, ...list.slice(1).map(tr => ({ ...newTr(), tr, system: sys })));
  touched(); render(); toast(`Added ${list.length} transports`);
});
document.addEventListener('focusout', e => { if (e.target.dataset?.tagin) commitTag(e.target); });
document.addEventListener('paste', e => {
  const inp = e.target.closest?.('[data-tagin]'); if (!inp) return;
  const text = e.clipboardData?.getData('text') || '';
  if (/[\s,;]/.test(text.trim())) { e.preventDefault(); inp.value = text; commitTag(inp); }
});
document.addEventListener('mousedown', e => { if (e.target.classList?.contains('tags')) { e.preventDefault(); $('.tag-in', e.target).focus(); } });
$('#fileIn').addEventListener('change', e => loadFile(e.target.files[0]));
$('#dlg').addEventListener('close', () => { if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(false); } });
document.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && doc) {
    e.preventDefault();
    if (view === 'dev') A.saveDraft(); else if (view === 'rev') A.saveProgress(); else A.dlJson();
  }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) sharedRefresh(true); });
setInterval(() => { if (!document.hidden && view === 'home') sharedRefresh(true); }, 60000);

$('#rpcss').textContent = REPORT_CSS;
{ const t = store.get('theme'); if (t) document.documentElement.dataset.theme = t; }
render();
sharedInit();
</script>
</body>
</html>
